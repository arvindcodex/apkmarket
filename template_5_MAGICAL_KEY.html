<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{name} — Magical Key VIP</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent !important;
  width: 100vw; height: 100vh;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  color: #fff;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
}

/* ── Game iframe behind HUD ── */
#target-game-frame {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  border: none;
  z-index: -1;
  pointer-events: auto;
  background: #000;
}

/* ── Keyframes ── */
@keyframes fab-float {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-5px) rotate(2deg); }
}
@keyframes rotate-cw { to { transform: rotate(360deg); } }
@keyframes rotate-ccw { to { transform: rotate(-360deg); } }
@keyframes dot-pulse {
  0%, 100% { transform: scale(0.85); opacity: 0.7; }
  50% { transform: scale(1.2); opacity: 1; }
}
@keyframes spdFadeIn {
  0% { opacity: 0; transform: scale(0.92); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes spdFadeOut {
  0% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(0.9); }
}
@keyframes ballPulse {
  0%, 100% {
    box-shadow: 0 0 16px rgba(34, 197, 94, 0.75), inset 0 3px 5px rgba(255, 255, 255, 0.8), inset 0 -4px 8px rgba(0, 0, 0, 0.85);
  }
  50% {
    box-shadow: 0 0 26px rgba(74, 222, 128, 0.95), inset 0 3px 6px rgba(255, 255, 255, 0.95), inset 0 -4px 8px rgba(0, 0, 0, 0.85);
  }
}
@keyframes redBallPulse {
  0%, 100% {
    box-shadow: 0 0 16px rgba(239, 68, 68, 0.75), inset 0 3px 5px rgba(255, 255, 255, 0.8), inset 0 -4px 8px rgba(0, 0, 0, 0.85);
  }
  50% {
    box-shadow: 0 0 26px rgba(248, 113, 113, 0.95), inset 0 3px 6px rgba(255, 255, 255, 0.95), inset 0 -4px 8px rgba(0, 0, 0, 0.85);
  }
}
@keyframes spinTumble {
  0% { transform: scale(0.95) rotate(-6deg); }
  50% { transform: scale(1.08) rotate(6deg); }
  100% { transform: scale(0.95) rotate(-6deg); }
}
@keyframes syncDotPulse {
  0%, 100% { opacity: 0.55; transform: scale(0.85); }
  50% { opacity: 1; transform: scale(1.2); }
}

/* ── Floating Mini FAB ── */
#mini {
  display: flex;
  position: absolute;
  left: 20px; top: 100px;
  width: 52px; height: 52px;
  cursor: pointer;
  touch-action: none;
  z-index: 2147483647;
  pointer-events: auto;
  will-change: left, top;
  align-items: center;
  justify-content: center;
  animation: fab-float 3.4s ease-in-out infinite;
}
#mini:active { cursor: grabbing; }

#fab-core {
  width: 48px; height: 48px;
  border-radius: 50%;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.25), transparent 25%), radial-gradient(circle, #1a0b2e, #0c0817 80%);
  border: 2px solid #8b5cf6;
  box-shadow: 0 0 16px rgba(139, 92, 246, 0.8), inset 0 0 10px rgba(139, 92, 246, 0.45);
  overflow: hidden;
  pointer-events: none;
}
#fab-core:before {
  content: ''; position: absolute; inset: -6px; border-radius: 50%;
  background: conic-gradient(transparent, #00f0ff, transparent, #ec4899, transparent, #8b5cf6, transparent);
  animation: rotate-cw 3s linear infinite;
}
#fab-core:after {
  content: ''; position: absolute; inset: 3px; border-radius: 50%;
  background: #0c0817; z-index: 1;
}
#fab-icon {
  position: relative; z-index: 3;
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
#fab-icon img {
  width: 100%; height: 100%; object-fit: cover;
  border-radius: 50%;
  filter: drop-shadow(0 0 5px #8b5cf6);
}
#fab-dot {
  position: absolute; right: 2px; top: 2px;
  width: 9px; height: 9px; border-radius: 50%;
  background: #00f0ff;
  box-shadow: 0 0 10px #00f0ff;
  z-index: 5;
  animation: dot-pulse 1.1s infinite;
}

/* ── Magical Key Stage HUD (Faithful to Screenshot a886cb21) ── */
#stage {
  display: none;
  position: absolute;
  left: calc(50% - 128px);
  top: calc(50% - 175px);
  width: 256px;
  min-height: 352px;
  z-index: 2147483647;
  touch-action: none;
  cursor: grab;
  pointer-events: auto;
  will-change: left, top;
  border-radius: 20px;
  padding: 10px 12px 12px;
  background: #0c0817;
  border: 2px solid transparent;
  background-image: linear-gradient(#0c0817, #0c0817), linear-gradient(135deg, #00f0ff 0%, #3b82f6 20%, #a855f7 48%, #ec4899 76%, #f59e0b 100%);
  background-origin: border-box;
  background-clip: padding-box, border-box;
  box-shadow: 0 0 24px rgba(168, 85, 247, 0.4), 0 14px 40px rgba(0, 0, 0, 0.95);
  flex-direction: column;
  justify-content: space-between;
}
#stage:active { cursor: grabbing; }
#stage.spd-open { display: flex; animation: spdFadeIn .25s ease-out forwards; }
#stage.spd-close { animation: spdFadeOut .2s ease-in forwards; pointer-events: none; }

/* ── Top Header: Orange Title on Left, Purple HIDE Pill on Right ── */
.mk-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 2px 2px 6px;
  flex: 0 0 auto;
}
.mk-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 12.5px;
  letter-spacing: 0.8px;
  color: #ff6a00;
  text-shadow: 0 0 10px rgba(255, 106, 0, 0.7);
  text-transform: uppercase;
  max-width: 170px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mk-hide-btn {
  background: #8b5cf6;
  border: none;
  border-radius: 7px;
  color: #ffffff;
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 4px 14px;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(139, 92, 246, 0.7);
  transition: transform 0.15s ease, opacity 0.15s ease;
  pointer-events: auto !important;
}
.mk-hide-btn:active { transform: scale(0.92); opacity: 0.9; }

/* ── Upper Section: Large Centered Holographic Radar Dial ── */
.mk-radar-container {
  position: relative;
  width: 100%;
  height: 138px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 2px 0 6px;
  flex: 0 0 auto;
}

/* Outer cyan ring */
.mk-ring-outer {
  position: absolute;
  width: 132px; height: 132px;
  border-radius: 50%;
  border: 1.8px solid #06b6d4;
  box-shadow: 0 0 12px rgba(6, 182, 212, 0.5), inset 0 0 8px rgba(6, 182, 212, 0.25);
  pointer-events: none;
}

/* Rotating golden dashed orbit */
.mk-ring-orbit-gold {
  position: absolute;
  width: 112px; height: 112px;
  border-radius: 50%;
  border: 1.5px dashed #f59e0b;
  animation: rotate-cw 14s linear infinite;
  pointer-events: none;
}
.mk-ring-orbit-gold:before {
  content: '';
  position: absolute;
  top: -4px; left: calc(50% - 4px);
  width: 7px; height: 7px;
  background: #fbbf24;
  transform: rotate(45deg);
  box-shadow: 0 0 8px #f59e0b;
}
.mk-ring-orbit-gold:after {
  content: '';
  position: absolute;
  bottom: -4px; left: calc(50% - 4px);
  width: 7px; height: 7px;
  background: #fbbf24;
  transform: rotate(45deg);
  box-shadow: 0 0 8px #f59e0b;
}

/* Rotating cyan inner reticle */
.mk-ring-inner-cyan {
  position: absolute;
  width: 94px; height: 94px;
  border-radius: 50%;
  border: 1.2px solid rgba(6, 182, 212, 0.65);
  animation: rotate-ccw 9s linear infinite;
  pointer-events: none;
}
.mk-ring-inner-cyan:before {
  content: '';
  position: absolute;
  left: -3px; top: calc(50% - 3px);
  width: 6px; height: 6px; border-radius: 50%;
  background: #00f0ff;
  box-shadow: 0 0 8px #00f0ff;
}
.mk-ring-inner-cyan:after {
  content: '';
  position: absolute;
  right: -3px; top: calc(50% - 3px);
  width: 6px; height: 6px; border-radius: 50%;
  background: #00f0ff;
  box-shadow: 0 0 8px #00f0ff;
}

/* Horizontal crosshair notches (Left & Right) */
.mk-notch-left {
  position: absolute;
  left: 10px; top: 50%;
  width: 24px; height: 2px;
  background: #06b6d4;
  box-shadow: 0 0 6px #06b6d4;
  transform: translateY(-50%);
  pointer-events: none;
}
.mk-notch-left:before {
  content: ''; position: absolute;
  left: 6px; top: -4px;
  width: 2px; height: 10px;
  background: #06b6d4;
}
.mk-notch-right {
  position: absolute;
  right: 10px; top: 50%;
  width: 24px; height: 2px;
  background: #06b6d4;
  box-shadow: 0 0 6px #06b6d4;
  transform: translateY(-50%);
  pointer-events: none;
}
.mk-notch-right:before {
  content: ''; position: absolute;
  right: 6px; top: -4px;
  width: 2px; height: 10px;
  background: #06b6d4;
}

/* Central 3D Ball */
.mk-ball {
  position: relative;
  z-index: 10;
  width: 58px; height: 58px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #86efac 0%, #22c55e 35%, #16a34a 65%, #052e16 100%);
  box-shadow: 0 0 20px rgba(34, 197, 94, 0.75), inset 0 3px 6px rgba(255, 255, 255, 0.85), inset 0 -4px 8px rgba(0, 0, 0, 0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  animation: ballPulse 2.8s ease-in-out infinite;
  transition: transform 0.2s ease, background 0.3s ease;
}
.mk-ball:active { transform: scale(0.92); }

.mk-ball.is-red {
  background: radial-gradient(circle at 35% 30%, #fca5a5 0%, #ef4444 35%, #b91c1c 65%, #450a0a 100%);
  animation: redBallPulse 2.8s ease-in-out infinite;
}

.mk-ball.spinning {
  animation: spinTumble 0.35s linear infinite !important;
}

.mk-ball-inner-circle {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
}

.mk-ball-num {
  font-family: 'Orbitron', sans-serif;
  font-size: 16px;
  font-weight: 900;
  color: #15803d;
  line-height: 1;
}
.mk-ball.is-red .mk-ball-num {
  color: #b91c1c;
}

/* ── Middle Section: Purple Information Panel (4 Rows) ── */
.mk-info-card {
  width: 100%;
  border-radius: 14px;
  background: linear-gradient(180deg, #8b5cf6 0%, #7c3aed 50%, #6d28d9 100%);
  border: 1.5px solid #a78bfa;
  box-shadow: 0 4px 15px rgba(109, 40, 217, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.3);
  padding: 9px 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 9px;
  flex: 0 0 auto;
}

/* Common row style */
.mk-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}
.mk-row-left, .mk-row-right {
  display: flex;
  align-items: center;
  gap: 6px;
}
.mk-row-label {
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  font-size: 10px;
  letter-spacing: 0.8px;
  color: #ffffff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}

/* Row 1: Signal Locked + BIG/SMALL Badge */
.mk-badge-verdict {
  background: #0c0817;
  border: 1.5px solid #22d3ee;
  border-radius: 6px;
  padding: 2px 12px;
  color: #22d3ee;
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 11px;
  letter-spacing: 1px;
  box-shadow: 0 0 8px rgba(34, 211, 238, 0.4);
  min-width: 58px;
  text-align: center;
}
.mk-badge-verdict.is-small {
  border-color: #f43f5e;
  color: #f43f5e;
  box-shadow: 0 0 8px rgba(244, 63, 94, 0.4);
}

/* Row 2: Sync + 4 Dots + 100% */
.mk-sync-track {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 10px;
}
.mk-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transition: all 0.25s ease;
}
.mk-dot.active {
  background: #ffffff;
  box-shadow: 0 0 8px #ffffff;
  animation: syncDotPulse 1.8s ease-in-out infinite;
}
.mk-pct-val {
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  font-size: 11px;
  color: #ffffff;
  min-width: 40px;
  text-align: right;
}

/* Row 3 & 4: Specs text */
.mk-spec-text {
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  font-size: 9px;
  color: #ffffff;
  letter-spacing: 0.5px;
}
.mk-spec-val {
  font-family: 'Share Tech Mono', monospace;
  font-weight: 900;
  font-size: 10px;
  letter-spacing: 1px;
  color: #ffffff;
}

/* ── Bottom Section: Full-Width Prominent Action Button ── */
.mk-action-btn {
  width: 100%;
  height: 42px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(90deg, #ff6600 0%, #f43f5e 50%, #ec4899 100%);
  color: #ffffff;
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 14px;
  letter-spacing: 2px;
  cursor: pointer;
  box-shadow: 0 5px 20px rgba(244, 63, 94, 0.55), 0 0 15px rgba(255, 102, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  text-transform: uppercase;
  transition: transform 0.15s ease, filter 0.2s ease;
  flex: 0 0 auto;
  pointer-events: auto !important;
}
.mk-action-btn:active {
  transform: scale(0.97);
  filter: brightness(1.1);
}
.mk-action-btn:disabled {
  filter: grayscale(0.6) opacity(0.7);
  cursor: not-allowed;
}

/* ── Panel views (auth / locked / main) ── */
.panel-view {
  display: none;
  width: 100%;
  flex-direction: column;
  justify-content: space-between;
  min-height: 0;
  flex: 1;
}
.panel-view.active { display: flex; }

#view-auth, #view-locked {
  align-items: center;
  text-align: center;
  padding: 10px 4px;
}
.view-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin: 15px 0;
}
.lock-icon-wrap {
  width: 52px; height: 52px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle, rgba(139, 92, 246, 0.35), rgba(12, 8, 23, 0.95));
  border: 1.8px solid #8b5cf6;
  box-shadow: 0 0 20px rgba(139, 92, 246, 0.6), inset 0 0 10px rgba(139, 92, 246, 0.4);
  color: #00f0ff;
}
.view-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 13px;
  letter-spacing: 1px;
  color: #fff;
  text-shadow: 0 0 8px rgba(139, 92, 246, 0.8);
}
.view-sub {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.8px;
  color: #ff6a00;
}

/* Warn Full Overlay */
#warnOverlay {
  position: fixed; inset: 0;
  z-index: 2147483648;
  background: rgba(8, 5, 13, 0.96);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  backdrop-filter: blur(10px);
  pointer-events: auto;
}
#warnOverlay.show { display: flex; }
.warn-card {
  width: 90%; max-width: 300px;
  padding: 22px 18px 20px;
  border-radius: 18px;
  background: #0c0817;
  border: 2px solid #8b5cf6;
  box-shadow: 0 0 35px rgba(139, 92, 246, 0.65), 0 20px 45px rgba(0, 0, 0, 0.95);
  text-align: center;
}
.warn-icon {
  width: 54px; height: 54px; margin: 0 auto 12px;
  border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle, rgba(139, 92, 246, 0.35), #0c0817);
  border: 2px solid #8b5cf6;
  color: #00f0ff;
  box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
}
.warn-title {
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 17px;
  letter-spacing: 1px; color: #fff; margin-bottom: 6px;
  text-shadow: 0 0 12px #8b5cf6;
}
.warn-msg {
  font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 11px;
  color: #ff6a00; margin-bottom: 10px;
}
.warn-detail {
  font-family: 'Inter', sans-serif; font-size: 9.5px; font-weight: 600;
  color: rgba(255, 255, 255, 0.8); line-height: 1.5; margin-bottom: 16px;
}
.warn-btn {
  width: 100%; height: 42px; border: none; border-radius: 12px;
  background: linear-gradient(90deg, #ff6600 0%, #f43f5e 50%, #ec4899 100%);
  color: #fff; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 13px;
  letter-spacing: 1.5px; cursor: pointer;
  box-shadow: 0 4px 18px rgba(244, 63, 94, 0.5);
}
</style>
</head>
<body>

<!-- Target Game iframe -->
<iframe id="target-game-frame" src="about:blank" allow="autoplay"></iframe>

<!-- Full-screen register warning overlay -->
<div id="warnOverlay" role="alertdialog">
  <div class="warn-card">
    <div class="warn-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <div class="warn-title">ACCESS LOCKED</div>
    <div class="warn-msg">REGISTER TO CONTINUE</div>
    <div class="warn-detail">Your account is not registered on our Firebase network. Please register first to unlock VIP access.</div>
    <button class="warn-btn" id="warnRegBtn" type="button">REGISTER NOW</button>
  </div>
</div>

<!-- Floating Mini FAB -->
<div id="mini" role="button" aria-label="Open {name}">
  <div id="fab-core">
    <div id="fab-icon">
      <img id="fab-img" src="logo.png" alt="logo">
    </div>
    <div id="fab-dot"></div>
  </div>
</div>

<!-- Main Magical Key Stage HUD -->
<div id="stage">

  <!-- Top Header with Title and HIDE button -->
  <div class="mk-header">
    <div class="mk-title">{name}</div>
    <button id="spd-hide" class="mk-hide-btn">HIDE</button>
  </div>

  <!-- VIEW 1: AUTH -->
  <div class="panel-view" id="view-auth">
    <div class="view-body">
      <div class="lock-icon-wrap">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div class="view-title">ACCESS LOCKED</div>
      <div class="view-sub">REGISTER FIRST</div>
    </div>
    <button class="mk-action-btn" id="btnRegister">REGISTER NOW</button>
  </div>

  <!-- VIEW 2: LOCKED (Low balance) -->
  <div class="panel-view" id="view-locked">
    <div class="view-body">
      <div class="lock-icon-wrap">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div class="view-title">LOW BALANCE</div>
      <div class="view-sub" id="lockSub">MIN DEPOSIT ₹{deposit}</div>
    </div>
    <button class="mk-action-btn" id="btnDeposit">DEPOSIT NOW</button>
  </div>

  <!-- VIEW 3: MAIN HUD (Faithful to Screenshot a886cb21) -->
  <div class="panel-view" id="view-main">

    <!-- Upper Section: Large Central Holographic Radar & 3D Ball -->
    <div class="mk-radar-container">
      <div class="mk-ring-outer"></div>
      <div class="mk-ring-orbit-gold"></div>
      <div class="mk-ring-inner-cyan"></div>
      <div class="mk-notch-left"></div>
      <div class="mk-notch-right"></div>

      <!-- Glowing Billiard Ball -->
      <div class="mk-ball" id="coinBall">
        <div class="mk-ball-inner-circle">
          <span class="mk-ball-num" id="coinNum">9</span>
        </div>
      </div>
    </div>

<script>
"use strict";

var opened = false;
var userRegistered = true;

/* ══════════════════════════════════════════════════════════════════

function navTo(url){
  try {
    if (window.ZAYRO && typeof window.ZAYRO.openUrl === 'function') window.ZAYRO.openUrl(url);
    else if (window.ZAYRO && typeof window.ZAYRO.navigate === 'function') window.ZAYRO.navigate(url);

/* ══════════════════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════════════════ */
function attachBtnHandler(id, handler){
  var el = document.getElementById(id);
  if (!el) return;
  var isHandling = false;
  var execute = function(e){
    if (e) { try { e.preventDefault(); e.stopPropagation(); } catch(err){} }
    if (isHandling) return;
    isHandling = true;
    handler();
    setTimeout(function(){ isHandling = false; }, 400);
  };
  el.addEventListener('click', execute);
  el.addEventListener('touchend', function(e){
    if (e.cancelable) { try { e.preventDefault(); } catch(err){} }
    execute(e);
  }, {passive: false});
}

/* ══════════════════════════════════════════════════════════════════
   STATE MACHINE + PREDICTION ENGINE
══════════════════════════════════════════════════════════════════ */
var curState = 'wingo';
var lastPageState = 'wait';
var currentPhone = null;
var warnActive = false;
var isOnRegisterPage = false;
var isOnWingoPage = true;
var isWorking = false;
var wingoHackDone = false;
var lastBalance = -1;
var everMetMin = false;
var lastPeriod = null;
var predData = null;
var lockedPeriod = null;
var lockedPrediction = null;

var LOGIC = {
  0:{n:5,s:'BIG'},   1:{n:2,s:'SMALL'}, 2:{n:4,s:'SMALL'},
  3:{n:7,s:'BIG'},   4:{n:8,s:'BIG'},   5:{n:9,s:'BIG'},
  6:{n:0,s:'SMALL'}, 7:{n:3,s:'SMALL'}, 8:{n:6,s:'BIG'},
  9:{n:1,s:'SMALL'}
};

var ALL_VIEWS = ['view-auth', 'view-locked', 'view-main'];
function showView(id){
  ALL_VIEWS.forEach(function(v){
    var el = document.getElementById(v);
    if (el) el.classList.toggle('active', v === id);
  });
}

function goState(n){
  stopAudio();
  curState = n;
  updateUI();
}

function updateUI(){
  if (curState === 'wait') {
    showView('view-auth');
  } else if (curState === 'low') {
    showView('view-locked');
    if (lockSub) lockSub.textContent = 'MIN DEPOSIT ₹' + fbMinDeposit;
  } else {
    showView('view-main');
    updateMainButton();
  }
}

function updateMainButton(){
  if (isWorking) return;
  if (!isOnWingoPage) {
    startBtn.innerText = 'DEPOSIT';
    startBtn.disabled = false;
    startBtn.onclick = function(){ navTo(DEPOSIT_URL); };
  } else if (wingoHackDone) {
    startBtn.innerText = 'RE-EXECUTE';
    startBtn.disabled = false;
    startBtn.onclick = runInjection;
  } else {
    startBtn.innerText = 'RE-EXECUTE';
    startBtn.disabled = false;
    startBtn.onclick = runInjection;
  }
}

/* ══════════════════════════════════════════════════════════════════
   PERIOD FETCHER
══════════════════════════════════════════════════════════════════ */
async function fetchPeriod(){
  try {
    var res = await fetch("https://api.bdg88zf.com/api/webapi/GetGameIssue", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        typeId: 1, language: 0,
        random: "40079dcba93a48769c6ee9d4d4fae23f",
        signature: "D12108C4F57C549D82B23A91E0FA20AE",
        timestamp: 1727792520
      })
    });
    var j = await res.json();
    if (j && j.code === 0 && j.data && j.data.issueNumber) {
      var cur = j.data.issueNumber.toString();
      if (cur !== lastPeriod) {
        lastPeriod = cur;
        var lg = LOGIC[parseInt(cur.slice(-1))];
        if (lg) predData = lg;
        if (periodNum) periodNum.innerText = cur.slice(-4);
      }
    }
  } catch(e) {}
}

/* ══════════════════════════════════════════════════════════════════
   BALL DISPLAY
══════════════════════════════════════════════════════════════════ */
function setBallDisplay(num){
  var n = parseInt(num, 10);
  if (isNaN(n)) n = 9;
  if (coinNum) coinNum.innerText = n;

  var isSmall = n >= 0 && n <= 4;
  var isRed = (n === 2 || n === 4 || n === 6 || n === 8 || n === 0);

  if (coinBall) {
    coinBall.classList.toggle('is-red', isRed);
  }
  if (sizeVal) {
    sizeVal.innerText = isSmall ? 'SMALL' : 'BIG';
  }
  if (sizeBadge) {
    sizeBadge.classList.toggle('is-small', isSmall);
  }
}

/* ══════════════════════════════════════════════════════════════════
   AUDIO
══════════════════════════════════════════════════════════════════ */
var _af = '', _at = 0;
function stopAudio(){ try { window.ZAYRO.stopSound(); } catch(e){} _af = ''; _at = 0; }
function playAudio(f){
  var n = Date.now();
  if (f === _af && n - _at < 2500) return;
  _af = f; _at = n;
  try { window.ZAYRO.playSound(f); } catch(e){
    try { var a = new Audio(f); a.volume = 1; var p = a.play(); if (p && p.catch) p.catch(function(){}); } catch(ee){}
  }
}

/* ══════════════════════════════════════════════════════════════════
   RUN INJECTION / RE-EXECUTE
══════════════════════════════════════════════════════════════════ */
var rouletteTimer = null;

function runInjection(){
  if (isWorking) return;
  isWorking = true;

  startBtn.disabled = true;
  startBtn.innerText = '🎲 SPINNING...';
  if (coinBall) coinBall.classList.add('spinning');

  // Dots progress animation
  [dot1, dot2, dot3, dot4].forEach(function(d){ if (d) d.classList.remove('active'); });
  if (syncPct) syncPct.innerText = '25%';

  setTimeout(function(){ if (dot1) dot1.classList.add('active'); if (syncPct) syncPct.innerText = '45%'; }, 300);
  setTimeout(function(){ if (dot2) dot2.classList.add('active'); if (syncPct) syncPct.innerText = '70%'; }, 750);
  setTimeout(function(){ if (dot3) dot3.classList.add('active'); if (syncPct) syncPct.innerText = '90%'; }, 1200);

  // Rapid number roll
  if (rouletteTimer) clearInterval(rouletteTimer);
  rouletteTimer = setInterval(function(){
    var r = Math.floor(Math.random() * 10);
    if (coinNum) coinNum.innerText = r;
  }, 75);

  var pred;
  if (lockedPeriod && lockedPeriod === lastPeriod && lockedPrediction) {
    pred = lockedPrediction;
  } else if (predData) {
    pred = predData;
    lockedPeriod = lastPeriod;
    lockedPrediction = pred;
  } else {
    pred = LOGIC[Math.floor(Math.random() * 10)];
    lockedPrediction = pred;
  }

  setTimeout(function(){
    if (rouletteTimer) { clearInterval(rouletteTimer); rouletteTimer = null; }
    if (coinBall) coinBall.classList.remove('spinning');
    if (dot4) dot4.classList.add('active');
    if (syncPct) syncPct.innerText = '100%';

    var chosenNum = parseInt(pred.n, 10);
    setBallDisplay(chosenNum);
    if (periodNum && lastPeriod) periodNum.innerText = lastPeriod.slice(-4);

    wingoHackDone = true;
    isWorking = false;
    startBtn.innerText = 'RE-EXECUTE';
    startBtn.disabled = false;
    startBtn.onclick = runInjection;

    playAudio(pred.s === 'BIG' ? 'big.mp3' : 'small.mp3');
    try { window.ZAYRO.speak(pred.s + ' ' + chosenNum); } catch(e){}
  }, 1900);
}

/* ══════════════════════════════════════════════════════════════════
   ROCK SOLID DRAG & TAP ENGINE (Galaxy Standard)
══════════════════════════════════════════════════════════════════ */
function openCard(){

  opened = true;
  var miniEl = document.getElementById("mini");
  var stageEl = document.getElementById("stage");
  if (miniEl) miniEl.style.display = 'none';

    stageEl.style.display = 'flex';

    stageEl.classList.add('spd-open');
  }
  isOnWingoPage = true;
  userRegistered = true;
  goState('wingo');
  updateUI();
}

function closeCard(){
  if (!opened) return;
  opened = false;
  var miniEl = document.getElementById("mini");
  var stageEl = document.getElementById("stage");
  if (stageEl){
    stageEl.classList.remove('spd-open');
    stageEl.classList.add('spd-close');
  }
  if (miniEl) miniEl.style.display = 'flex';
  setTimeout(function(){
    if (!opened && stageEl){
      stageEl.style.display = 'none';
      stageEl.classList.remove('spd-close');
    }
  }, 220);
}

function makeDraggable(el, clickCallback){
  var sx = 0, sy = 0, ox = 0, oy = 0, isDragging = false, hasMoved = false;
  function start(e){
    if (e.target && e.target.closest && e.target.closest('button')) return;
    if (e.target && e.target.tagName && e.target.tagName.toLowerCase() === 'button') return;
    var p = e.touches ? e.touches[0] : e;
    sx = p.clientX; sy = p.clientY;
    var comp = window.getComputedStyle(el);
    ox = parseInt(comp.left, 10); oy = parseInt(comp.top, 10);
    if (isNaN(ox)) ox = el.offsetLeft || 0;
    if (isNaN(oy)) oy = el.offsetTop || 0;
    isDragging = true; hasMoved = false;
    el.style.transition = 'none';
    if (el.id === 'mini'){ el.style.animation = 'none'; }
  }
  function move(e){
    if (!isDragging) return;
    var p = e.touches ? e.touches[0] : e;
    var dx = p.clientX - sx, dy = p.clientY - sy;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) hasMoved = true;
    el.style.left = Math.max(4, Math.min(window.innerWidth - el.offsetWidth - 4, ox + dx)) + 'px';
    el.style.top = Math.max(4, Math.min(window.innerHeight - el.offsetHeight - 4, oy + dy)) + 'px';
    if (e.cancelable) e.preventDefault();
  }
  function end(){
    if (!isDragging) return;
    isDragging = false;
    el.style.transition = '';
    if (el.id === 'mini'){ el.style.animation = 'fab-float 3.4s ease-in-out infinite'; }
    if (!hasMoved && typeof clickCallback === 'function') clickCallback();
  }
  el.addEventListener('touchstart', start, {passive: true});
  el.addEventListener('mousedown', start, false);
  document.addEventListener('touchmove', move, {passive: false});
  document.addEventListener('mousemove', move, false);
  document.addEventListener('touchend', end);
  document.addEventListener('mouseup', end);
}

makeDraggable(mini, openCard);
makeDraggable(stage, null);
