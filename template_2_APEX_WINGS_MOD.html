<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{name} - Cyber Rose</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700;800;900&family=Share+Tech+Mono&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{background:transparent!important;background-color:transparent!important;width:100vw;height:100vh;overflow:hidden;font-family:'Orbitron','Inter',sans-serif;color:#4a0026;pointer-events:none}
#bgFrame{position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:-1;pointer-events:auto;background:#000!important}

@keyframes rotate-cw{to{transform:rotate(360deg)}}
@keyframes rotate-ccw{to{transform:rotate(-360deg)}}
@keyframes dot-pulse{0%,100%{transform:scale(.85);opacity:.7}50%{transform:scale(1.2);opacity:1}}
@keyframes panelFadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes panelFadeOut{0%{opacity:1}100%{opacity:0}}
@keyframes btn-glare{0%{transform:translateX(-150%) skewX(-25deg)}45%,100%{transform:translateX(250%) skewX(-25deg)}}
@keyframes result-burst{0%{transform:scale(.4);opacity:0;filter:blur(8px)}70%{transform:scale(1.1);opacity:1;filter:blur(0)}100%{transform:scale(1);opacity:1}}
@keyframes hieroUp{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.6}80%{opacity:.35}100%{transform:translateY(-230px) rotate(14deg);opacity:0}}

#warnOverlay{position:fixed;inset:0;z-index:2147483647;background:rgba(40,0,15,.94);display:none;align-items:center;justify-content:center;text-align:center;padding:32px 22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:auto}
#warnOverlay.show{display:flex!important}
.warn-card{position:relative;width:88%;max-width:300px;padding:24px 20px;border-radius:20px;background:linear-gradient(180deg,#ffebf5 0%,#ffd6eb 45%,#ffb8dd 100%);border:2.5px solid #fff;box-shadow:0 0 0 1.5px #ff4da6,0 0 35px rgba(255,77,166,.85),0 0 70px rgba(255,26,140,.4),inset 0 2px 4px #fff;animation:result-burst .3s cubic-bezier(.18,.89,.32,1.28) both;pointer-events:auto}
.warn-badge{display:inline-block;font-family:'Share Tech Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.18em;color:#d6006e;padding:3px 10px;border:1.5px solid #d6006e;background:#fff;border-radius:4px;margin-bottom:12px;box-shadow:0 0 8px rgba(214,0,110,.4)}
.warn-title{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:900;color:#4a0026;letter-spacing:.08em;margin-bottom:6px}
.warn-msg{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;letter-spacing:.1em;color:#d6006e;text-shadow:0 0 10px rgba(255,26,140,.5);margin-bottom:4px}
.warn-sub{font-family:'Inter',sans-serif;font-size:9px;font-weight:800;letter-spacing:.14em;color:#4a0026;text-transform:uppercase;margin-bottom:18px}
.warn-btn{width:100%;padding:12px;border:none;border-radius:10px;cursor:pointer;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;letter-spacing:.14em;color:#fff;text-transform:uppercase;background:linear-gradient(180deg,#ff3399 0%,#d6006e 40%,#99004d 100%);box-shadow:0 0 18px rgba(255,26,140,.75),0 3px 8px rgba(153,0,77,.6),inset 0 1px 3px rgba(255,255,255,.7);transition:transform .15s ease,filter .15s ease;pointer-events:auto}
.warn-btn:active{transform:scale(.96)}

#mini{position:fixed;top:0;left:0;width:54px;height:54px;cursor:grab;touch-action:none;z-index:2147483647;will-change:transform;pointer-events:auto;display:flex;align-items:center;justify-content:center}
#mini.is-dragging,#mini:active{cursor:grabbing!important}
#spd-fab-core{width:48px;height:48px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;background:transparent;border:none;overflow:visible}
#spd-fab-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:transparent;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#spd-fab-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%;pointer-events:none;user-select:none;-webkit-user-drag:none}

#stage{display:none;position:fixed;top:0;left:0;width:180px;height:220px;z-index:2147483647;touch-action:none;cursor:grab;will-change:transform;pointer-events:auto}
#stage.is-dragging,#stage:active{cursor:grabbing!important}
#stage.spd-open{display:block;animation:panelFadeIn .22s cubic-bezier(.16,1,.3,1) forwards}
#stage.spd-close{animation:panelFadeOut .18s ease-in forwards;pointer-events:none}

.flight-chassis{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;animation:sxChassisFloat 2.25s ease-in-out infinite}
@keyframes sxChassisFloat{50%{transform:translateY(-6px) rotate(-.35deg)}}
.wing-backlight{position:absolute;width:220px;height:130px;background:radial-gradient(ellipse,rgba(255,26,140,.38) 0%,rgba(255,77,166,.18) 45%,transparent 70%);filter:blur(12px);pointer-events:none}
.wing{position:absolute;width:120px;height:135px;background-image:url('https://files.catbox.moe/b2krfe.png');background-size:200% 100%;background-repeat:no-repeat;filter:hue-rotate(285deg) saturate(1.4) brightness(1.05) drop-shadow(0 0 8px rgba(255,26,140,.45)) drop-shadow(0 4px 10px rgba(50,0,25,.22));will-change:transform,filter;pointer-events:none}
.wing-particles-canvas{position:absolute;width:360px;height:250px;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:2}
.wing.left{left:-78px;top:30px;background-position:0% 50%;transform-origin:92% 50%;animation:smoothWingFlapLeft 2.2s ease-in-out infinite alternate}
.wing.right{right:-78px;top:30px;background-position:100% 50%;transform-origin:8% 50%;animation:smoothWingFlapRight 2.2s ease-in-out infinite alternate}
@keyframes smoothWingFlapLeft{0%{transform:rotateZ(-15deg) rotateY(-26deg) scale(.93)}100%{transform:rotateZ(12deg) rotateY(16deg) scale(1.04)}}
@keyframes smoothWingFlapRight{0%{transform:rotateZ(15deg) rotateY(26deg) scale(.93)}100%{transform:rotateZ(-12deg) rotateY(-16deg) scale(1.04)}}

.card-frame{position:relative;z-index:2;width:100%;height:100%;border-radius:16px;background:linear-gradient(180deg,#ffebf5 0%,#ffd6eb 45%,#ffb8dd 100%);border:2.5px solid #fff;box-shadow:0 0 0 1.5px #ff4da6,0 0 18px rgba(255,77,166,.85),0 0 35px rgba(255,26,140,.35),inset 0 2px 4px #fff,inset 0 -3px 6px rgba(214,0,110,.2);display:flex;flex-direction:column;padding:5px 8px 6px;overflow:hidden;cursor:grab}
.card-frame:active{cursor:grabbing}
.card-grid{position:absolute;inset:4px;border-radius:12px;background-image:linear-gradient(rgba(255,77,166,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,77,166,.12) 1px,transparent 1px);background-size:10px 10px;pointer-events:none;z-index:1}

.card-header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;height:24px}
.title-name{display:inline-flex;align-items:center;font-family:'Orbitron','Rajdhani',sans-serif;line-height:1;white-space:nowrap;text-transform:uppercase;margin-left:-6px}
.title-brand{font-size:9.5px;font-weight:900;letter-spacing:.8px;background:linear-gradient(180deg,#d6006e 0%,#a0004e 50%,#5a0028 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 1px rgba(255,255,255,.95)) drop-shadow(0 0 5px rgba(255,26,140,.65))}
.btn-hide-top{font-family:'Orbitron',sans-serif;font-weight:800;font-size:8px;color:#fff;letter-spacing:.5px;background:olivedrab;border:1.5px solid #fff;border-radius:6px;padding:2px 7px;margin-right:-6.5px;box-shadow:0 1px 5px rgba(214,0,110,.2),inset 0 1px 2px #fff;cursor:pointer;outline:none;transition:all .2s ease}
.btn-hide-top:active{transform:scale(.95)}

.radar-arena{position:relative;z-index:5;flex:none;display:flex;align-items:center;justify-content:center;margin:0;width:100%;height:116px;min-height:116px;max-height:116px;flex-shrink:0}
.orbit-ring-ticks{animation:radarSpinCW 32s linear infinite;transform-origin:107.5px 107.5px;transform-box:view-box;filter:drop-shadow(0 0 2.5px rgba(255,42,141,.7))}
.orbit-ring-points{animation:radarSpinCCW 24s linear infinite;transform-origin:107.5px 107.5px;transform-box:view-box;filter:drop-shadow(0 0 3px rgba(224,86,253,.75))}
.orbit-ring-dotted{animation:radarSpinCW 44s linear infinite;transform-origin:107.5px 107.5px;transform-box:view-box}
.orbit-overdrive .orbit-ring-ticks{animation:radarSpinCW 10.6s linear infinite!important;filter:drop-shadow(0 0 5px rgba(255,42,141,.95)) drop-shadow(0 0 2px #fff)!important}
.orbit-overdrive .orbit-ring-points{animation:radarSpinCCW 8s linear infinite!important;filter:drop-shadow(0 0 6px rgba(224,86,253,1)) drop-shadow(0 0 2px #fff)!important}
.orbit-overdrive .orbit-ring-dotted{animation:radarSpinCW 14.6s linear infinite!important}
@keyframes radarSpinCW{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes radarSpinCCW{from{transform:rotate(360deg)}to{transform:rotate(0)}}

.diamond-pointer{position:absolute;width:10px;height:10px;background:#fff;border:1.8px solid #d6006e;transform:rotate(45deg);z-index:9;box-shadow:0 0 6px rgba(214,0,110,.4)}
.dp-top{top:-2px;left:calc(50% - 5px)}
.dp-right{right:28px;top:calc(50% - 5px)}
.dp-bottom{bottom:-2px;left:calc(50% - 5px)}
.dp-left{left:28px;top:calc(50% - 5px)}

.crosshair-beam-h{position:absolute;left:10px;right:10px;top:50%;height:1px;background:linear-gradient(90deg,transparent 0%,#ff4da6 20%,#fff 50%,#ff4da6 80%,transparent 100%);opacity:.6;pointer-events:none;z-index:3;animation:crosshairScan 4s ease-in-out infinite}
.crosshair-beam-v{position:absolute;top:2px;bottom:2px;left:50%;width:1px;background:linear-gradient(180deg,transparent 0%,#ff4da6 20%,#fff 50%,#ff4da6 80%,transparent 100%);opacity:.6;pointer-events:none;z-index:3;animation:crosshairScan 4s ease-in-out infinite 2s}
@keyframes crosshairScan{0%,100%{opacity:.45}50%{opacity:.85;filter:drop-shadow(0 0 2px #ff4da6)}}

.hud-border-bracket{position:absolute;top:2px;bottom:2px;width:25px;pointer-events:none;z-index:8;display:flex;align-items:center}
.hud-border-left{left:0}
.hud-border-right{right:0;transform:scaleX(-1)}
.hud-border-svg{width:100%;height:100%;overflow:visible}
.hud-laser-tracer{stroke-dasharray:20 80;animation:hudLaserTravel 2.4s linear infinite}
.hud-border-right .hud-laser-tracer{animation-delay:-1.2s}
@keyframes hudLaserTravel{0%{stroke-dashoffset:100;opacity:.3}50%{opacity:1;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 8px #ff007f)}100%{stroke-dashoffset:-100;opacity:.3}}
.hud-rail-scanner{animation:hudRailScan 2.4s cubic-bezier(.4,0,.2,1) infinite alternate}
.hud-border-right .hud-rail-scanner{animation-delay:-1.2s}
@keyframes hudRailScan{0%{transform:translateY(-46px);opacity:.4}50%{opacity:1;filter:drop-shadow(0 0 3.5px #fff) drop-shadow(0 0 7px #ff007f) drop-shadow(0 0 12px #d6006e)}100%{transform:translateY(46px);opacity:.4}}
.hud-chevron-mark{animation:chevronPulse 1.6s ease-in-out infinite}
.hud-chevron-mark-2{animation:chevronPulse 1.6s ease-in-out infinite .8s}
@keyframes chevronPulse{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 6px #ff2a8d);transform:translateX(1.5px)}}
.hud-corner-plate{animation:plateGlow 3s ease-in-out infinite alternate}
@keyframes plateGlow{0%{fill:rgba(255,42,141,.18);stroke:rgba(255,255,255,.7)}100%{fill:rgba(255,42,141,.45);stroke:#fff;filter:drop-shadow(0 0 4px #ff007f)}}
.hud-meter-tick-main{animation:meterTickAnim 2.2s ease-in-out infinite alternate}
.hud-meter-tick-sub{animation:meterTickAnim 2.2s ease-in-out infinite alternate 1.1s}
@keyframes meterTickAnim{0%{opacity:.4;stroke-width:1}100%{opacity:1;stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 0 3px #ff2a8d)}}
.hud-pulse-node{animation:hudNodeBlink 1.5s ease-in-out infinite}
.hud-pulse-node-alt{animation:hudNodeBlink 1.5s ease-in-out infinite .75s}
@keyframes hudNodeBlink{0%,100%{opacity:.4;r:1.3}50%{opacity:1;r:2.2;fill:#fff;filter:drop-shadow(0 0 4px #ff007f) drop-shadow(0 0 8px #fff)}}
.orbit-overdrive ~ .hud-border-bracket .hud-laser-tracer{animation-duration:.6s!important;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px #ff007f)!important}
.orbit-overdrive ~ .hud-border-bracket .hud-rail-scanner{animation-duration:.7s!important;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px #ff007f)!important}

.orbit-rings-svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:125px;height:125px;pointer-events:none;z-index:4;margin:0}

.pearl-orb-stage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:6;background:radial-gradient(circle at 48% 38%,#ff99cc 0%,#ff66b2 35%,#ff3399 70%,#e6007a 100%);border:2.5px solid #fff;box-shadow:0 0 20px rgba(255,102,178,.5),0 6px 18px rgba(230,0,122,.28),inset 0 2px 8px rgba(255,204,230,.6),inset 0 -5px 12px rgba(214,0,110,.25);cursor:pointer;overflow:hidden;margin:0;transition:none}
.pearl-orb-stage:active{transform:translate(-50%,-50%) scale(.97)}

.hiero-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;border-radius:14px}
.hiero-float{position:absolute;pointer-events:none;z-index:2;animation:hieroUp linear infinite;font-family:'Share Tech Mono',sans-serif;text-shadow:0 0 5px rgba(255,77,166,.6)}

.orb-content{position:absolute;inset:0;z-index:8;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;margin:0}
.stb-box{display:flex;flex-direction:column;align-items:center;justify-content:center}
.stb-text-main{font-family:'Orbitron',sans-serif;font-weight:900;font-size:10px;color:#fff;letter-spacing:1px;text-shadow:0 1px 4px rgba(80,0,30,.9),0 0 8px #fff}
.stb-text-sub{font-family:'Inter',sans-serif;font-weight:800;font-size:6px;color:#fff0f7;letter-spacing:.8px;text-transform:uppercase}
.ldr-box{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:3px}
.ldr-stage-text{font-family:'Orbitron',sans-serif;font-weight:900;font-size:8px;color:#fff;letter-spacing:1px;text-shadow:0 1px 3px rgba(80,0,30,.9),0 0 6px rgba(255,255,255,.7)}
.ldr-pct-text{font-family:'Share Tech Mono',monospace;font-size:11px;font-weight:700;color:#fff;letter-spacing:.5px;text-shadow:0 0 6px #fff,0 1px 3px rgba(80,0,30,.9)}
.ldr-bar-track{width:52px;height:3.5px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;margin-top:1px;border:1px solid rgba(255,255,255,.75);box-shadow:0 0 4px rgba(255,77,166,.4)}
.ldr-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff80bf,#fff);box-shadow:0 0 6px #fff;transition:width .12s linear}
.res-box{display:flex;flex-direction:column;align-items:center;justify-content:center;animation:result-burst .4s cubic-bezier(.18,.89,.32,1.28) forwards}
.res-bs-text{position:relative;z-index:5;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:#fff;text-shadow:0 0 8px #fff,0 0 15px #ff1a8c,0 2px 4px rgba(70,0,30,.95);letter-spacing:1.2px;line-height:1;margin-top:-3px;margin-bottom:4px}
.res-ball-img{position:relative;z-index:5;width:29px;height:29px;object-fit:contain;border-radius:50%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45)) drop-shadow(0 0 8px rgba(255,77,166,.5));animation:ballPopIn .38s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes ballPopIn{0%{transform:scale(.4) rotate(-15deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

.dual-info-row{position:relative;z-index:10;display:flex;align-items:center;gap:5px;margin-bottom:5px;width:100%;height:25px;flex-shrink:0}
.info-pill{flex:1;min-width:0;height:25px;background:linear-gradient(180deg,#fff 0%,#ffebf5 40%,#ffd6eb 100%);border:1.5px solid #ff99cc;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;gap:3px;box-shadow:inset 0 1px 2px #fff,0 2px 5px rgba(214,0,110,.18);white-space:nowrap}
.info-label{font-family:'Orbitron',sans-serif;font-weight:900;font-size:7.5px;letter-spacing:.4px;color:#4a0026;display:inline-flex;align-items:center}
.info-val{font-family:'Share Tech Mono',monospace;font-size:8.5px;font-weight:700;color:#d6006e;letter-spacing:.6px}
.ping-live-dot{width:4px;height:4px;border-radius:50%;background:#00d977;box-shadow:0 0 5px #00d977;display:inline-block;flex-shrink:0;margin-right:1px}

.btn-execute{position:relative;z-index:10;width:100%;height:32px;border:2px solid #fff;border-radius:10px;background:linear-gradient(180deg,#ff3399 0%,#d6006e 40%,#99004d 100%);box-shadow:0 0 14px rgba(255,26,140,.75),0 3px 8px rgba(153,0,77,.6),inset 0 1px 3px rgba(255,255,255,.7),inset 0 -2px 5px rgba(70,0,35,.6);cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.2,.8,.2,1);outline:none}
.btn-execute:hover{transform:scale(1.02);box-shadow:0 0 20px rgba(255,51,153,1),0 4px 12px rgba(153,0,77,.8),inset 0 1px 4px rgba(255,255,255,.9)}
.btn-execute:active{transform:scale(.98)}
.btn-execute:disabled{filter:grayscale(.6) opacity(.8);cursor:not-allowed;transform:none}
.btn-execute::before{content:'';position:absolute;inset:0;background-image:linear-gradient(45deg,rgba(255,255,255,.2) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.2) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,255,255,.2) 75%),linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.2) 75%);background-size:6px 6px;background-position:0 0,0 3px,3px -3px,-3px 0;opacity:.35;pointer-events:none}
.btn-execute::after{content:'';position:absolute;top:0;left:0;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:btn-glare 4s infinite cubic-bezier(.4,0,.2,1);pointer-events:none}
.btn-execute-text{position:relative;z-index:5;font-family:'Orbitron',sans-serif;font-weight:900;font-size:12px;color:#fff;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 8px rgba(255,255,255,.8),0 1px 3px rgba(0,0,0,.6)}

@media (prefers-reduced-motion:reduce){.orbit-ring-ticks,.orbit-ring-points,.orbit-ring-dotted,.diamond-pointer,.crosshair-beam-h,.crosshair-beam-v{animation:none!important}}
</style>
</head>
<body>

<iframe id="bgFrame" src="about:blank" allow="autoplay"></iframe>

<div id="warnOverlay" role="alertdialog">
  <div class="warn-card">
    <div class="warn-badge">AUTH</div>
    <div class="warn-title">{name}</div>
    <div class="warn-msg">ACCESS LOCKED</div>
    <div class="warn-sub">REGISTER OR LOGIN TO CONTINUE</div>
    <button class="warn-btn" id="warnRegBtn" type="button">REGISTER</button>
  </div>
</div>

<div id="mini" role="button" aria-label="Open Apex Tool">
  <div id="spd-fab-core">
    <div id="spd-fab-icon">
      <img id="spd-fab-img" src="logo.png" alt="icon">
    </div>
  </div>
</div>

<div id="stage">
  <div class="flight-chassis">
    <div class="wing-backlight"></div>
    <div class="wing left"></div>
    <div class="wing right"></div>
    <canvas class="wing-particles-canvas" id="wingParticlesCanvas"></canvas>
  </div>

  <div class="card-frame" id="cardDragHandle">
    <div class="card-grid"></div>
    <div class="hiero-layer" id="hieroLayer"></div>

    <div class="card-header">
      <div class="title-name">
        <span class="title-brand">{name}</span><span class="title-tag"></span>
      </div>
      <button class="btn-hide-top" id="btnTopHide" title="Hide window">HIDE</button>
    </div>

    <div class="radar-arena">
      <div class="hud-border-bracket hud-border-left">
        <svg class="hud-border-svg" viewBox="0 0 25 110" fill="none">
          <defs>
            <linearGradient id="caliperGradL" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fff" stop-opacity=".95"/>
              <stop offset="25%" stop-color="#ff2a8d"/>
              <stop offset="50%" stop-color="#ff79c6"/>
              <stop offset="75%" stop-color="#ff2a8d"/>
              <stop offset="100%" stop-color="#fff" stop-opacity=".95"/>
            </linearGradient>
            <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="transparent"/>
              <stop offset="45%" stop-color="#ff2a8d"/>
              <stop offset="50%" stop-color="#fff"/>
              <stop offset="55%" stop-color="#ff2a8d"/>
              <stop offset="100%" stop-color="transparent"/>
            </linearGradient>
            <filter id="borderNeonGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="0" stdDeviation="1.6" flood-color="#ff007f" flood-opacity=".95"/>
            </filter>
          </defs>

var _af = '', _at = 0, _currentAudio = null, _audioUnlocked = false;
var _retryQueue = [];
var _voiceLock = false;
var _voiceTimeout = null;
var _voiceSafety = null;

function _doPlay(f) {
  try {
    if (_currentAudio) {
      try { _currentAudio.pause(); _currentAudio.currentTime = 0; } catch(e){}
    }
    var audio = new Audio(f);
    audio.volume = 1;
    audio.preload = 'auto';
    _currentAudio = audio;
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function(err){ _retryQueue.push(f); });
    }
  } catch(e) {}
}

function playAudio(f) {
  var n = Date.now();
  if (f === _af && n - _at < 3000) return;
  _af = f; _at = n;
  _doPlay(f);
}

function playAudioForce(f) {
  _af = f; _at = Date.now();
  _doPlay(f);
}

function stopAudio() {
  if (_currentAudio) {
    try { _currentAudio.pause(); _currentAudio.currentTime = 0; } catch(e){}
    _currentAudio = null;
  }
  _af = ''; _at = 0;
}

function _flushRetryQueue() {
  if (!_retryQueue.length) return;
  var files = _retryQueue.slice();
  _retryQueue = [];
  files.forEach(function(f){
    try {
      var a = new Audio(f);
      a.volume = 1;
      a.play().catch(function(){});
    } catch(e){}
  });
}

// STRICT VOICE FUNCTION (Fixes hanging engine & repeat issues)
function speak(text) {
  if (_voiceLock) {
    try { window.speechSynthesis.cancel(); } catch(e){}
    _voiceLock = false;
    if (_voiceTimeout) { clearTimeout(_voiceTimeout); _voiceTimeout = null; }
    if (_voiceSafety) { clearTimeout(_voiceSafety); _voiceSafety = null; }
  }
  
  _voiceLock = true;
  
  _voiceSafety = setTimeout(function() {
    _voiceLock = false;
  }, 6000);

  try {
    if (!window.speechSynthesis) { _voiceLock = false; return; }
    
    window.speechSynthesis.cancel();
    window.speechSynthesis.resume();
    
    _voiceTimeout = setTimeout(function() {
      try {
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.9;
        u.pitch = 1.0;
        u.volume = 1.0;
        
        u.onend = function() { 
          _voiceLock = false; 
          if (_voiceSafety) { clearTimeout(_voiceSafety); _voiceSafety = null; }
        };
        u.onerror = function() { 
          _voiceLock = false; 
          if (_voiceSafety) { clearTimeout(_voiceSafety); _voiceSafety = null; }
        };
        
        window.speechSynthesis.speak(u);
      } catch(e) { 
        _voiceLock = false; 
        if (_voiceSafety) { clearTimeout(_voiceSafety); _voiceSafety = null; }
      }
    }, 150);
  } catch(e) { 
    _voiceLock = false; 
    if (_voiceSafety) { clearTimeout(_voiceSafety); _voiceSafety = null; }
  }
}

function unlockAudio() {
  if (_audioUnlocked) return;
  _audioUnlocked = true;
  try {
    if (window.speechSynthesis) {
      var u = new SpeechSynthesisUtterance(' ');
      u.volume = 0.01;
      u.rate = 2;
      window.speechSynthesis.speak(u);
      window.speechSynthesis.resume();
    }
  } catch(e){}

    var silent = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=');
    silent.volume = 0.01;
    silent.play().catch(function(){});
  } catch(e){}
}

  var p = phone.toString().trim().replace(/[^0-9]/g,'');

function _goState(n) {
  curState = n;
  if (n === 'wait') { _lowBalancePlayed = false; _successPlayed = false; }
  if (n === 'low') {
    if (lastPageState === 'wingo') {
      setTimeout(function(){ if (curState === 'low') playAudioForce('deposit.mp3'); }, 120);
    } else if (!_lowBalancePlayed) {
      _lowBalancePlayed = true;
      setTimeout(function(){ if (curState === 'low') playAudioForce('lowbalance.mp3'); }, 120);
    }
  }
  if (n === 'wingo' && !everMetMin && fbDepositCondition) {
    setTimeout(function(){ if (!everMetMin && curState === 'wingo') playAudioForce('deposit.mp3'); }, 2200);
  }
  updateUI();
}

window.setState = function(name) {
  if (name === 'wait') {
    lastPageState = 'wait'; bypassRunning = false; _goState('wait');
  } else if (name === 'home') {
    lastPageState = 'home'; bypassRunning = false;
    if (!fbDepositCondition || everMetMin || lastBalance >= minDeposit) _goState('home');
    else _goState('low');
  } else if (name === 'wingo') {
    lastPageState = 'wingo';
    if (bypassRunning) return;
    if (!fbDepositCondition || everMetMin || lastBalance >= minDeposit) {
      _goState('wingo'); wingoHackDone = false;
    } else {
      _goState('low');
    }
  }
};

window.setBalance = function(bal) {
  lastBalance = parseFloat(bal) || 0;
  if (!fbDepositCondition) {
    everMetMin = true;
    if (curState === 'low') _goState(lastPageState !== 'wait' ? lastPageState : 'home');
    else updateUI();
    return;
  }
  
  if (lastBalance < 10) {
    everMetMin = false;
    if (curState === 'low' || curState === 'wingo' || curState === 'home' || curState === 'wait') _goState('low');
  } else if (lastBalance >= minDeposit) {
    everMetMin = true;
    if (curState === 'low') _goState(lastPageState !== 'wait' ? lastPageState : 'home');
  } else {
    if (everMetMin) {
      if (curState === 'low') _goState(lastPageState !== 'wait' ? lastPageState : 'home');
    } else {
      if (curState !== 'wingo' && curState !== 'low') _goState('low');
    }
  }
  updateUI();
};

    stopRegisterMon();
    if (!isLogin && pendingRegPhone) {
      saveRegisteredUserToFirebase(pendingRegPhone);
      currentPhone = pendingRegPhone;
      pendingRegPhone = null;
    }
  }

  if (isLogin) {
    wasAuthFlowActive = true;
    hideWarnOverlay();
    startLoginMon();
  } else {
    stopLoginMon();
  }

  if (isWingo) {
    if (!bypassRunning) window.setState('wingo');
    else lastPageState = 'wingo';
  } else if (isLogin) {
    window.setState('wait');
  } else if (isDeposit) {

  } else {
    var _wasAuth = wasAuthFlowActive;

    window.setState('home');
    if (_wasAuth && !_successPlayed) {
      _successPlayed = true;
      playAudioForce('successful.mp3');
      if (!_successVoicePlayed) {
        _successVoicePlayed = true;
        setTimeout(function(){ speak('Login successful'); }, 1000);
      }
    }
  }

function initWingParticlesEngine() {
  var canvas = document.getElementById('wingParticlesCanvas');

      color: colors[Math.floor(Math.random() * colors.length)],
      size: type === 1 ? (2.2 + Math.random() * 1.5) : (2.0 + Math.random() * 1.6),
      alpha: 0, maxAlpha: 0.6 + Math.random() * 0.35,
      life: 0, maxLife: Math.floor(80 + Math.random() * 60),
      wobble: Math.random() * Math.PI * 2, wobbleSpeed: 0.025 + Math.random() * 0.04,
      wobbleRadius: 0.25 + Math.random() * 0.35, rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.05
    };
  }

  if (wingParticles.length === 0) {
    for (var i=0; i<4; i++) { var pp = spawnParticle(); pp.life = Math.floor(Math.random() * pp.maxLife); wingParticles.push(pp); }
  }

  function loop() {
    if (!opened) { wingParticlesRaf = null; return; }
    ctx.clearRect(0, 0, cssW, cssH);
    var currentCap = bypassRunning ? MAX_WING_PARTICLES : 7;
    if (wingParticles.length < currentCap && Math.random() < 0.08) wingParticles.push(spawnParticle());
    for (var i = wingParticles.length - 1; i >= 0; i--) {
      var p = wingParticles[i];
      p.life++;
      if (p.life >= p.maxLife) { wingParticles.splice(i, 1); continue; }
      var progress = p.life / p.maxLife;
      if (progress < 0.18) p.alpha = (progress / 0.18) * p.maxAlpha;
      else if (progress > 0.68) p.alpha = ((1 - progress) / 0.32) * p.maxAlpha;
      else p.alpha = p.maxAlpha;
      p.wobble += p.wobbleSpeed; p.x += p.vx + Math.sin(p.wobble) * p.wobbleRadius;
      p.y += p.vy; p.rot += p.rotSpeed;
      ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, p.alpha)); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.type === 1) {

        ctx.beginPath(); ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s * 0.45, 0); ctx.quadraticCurveTo(0, 0, 0, s); ctx.quadraticCurveTo(0, 0, -s * 0.45, 0); ctx.quadraticCurveTo(0, 0, 0, -s); ctx.fill();
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0, 0, s * 0.28, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, s2 * 2.2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    wingParticlesRaf = requestAnimationFrame(loop);
  }

  window.startWingParticles = function(){ if (!wingParticlesRaf) wingParticlesRaf = requestAnimationFrame(loop); };
  window.stopWingParticles = function(){ if (wingParticlesRaf) { cancelAnimationFrame(wingParticlesRaf); wingParticlesRaf = null; } };
  if (opened) window.startWingParticles();
}

function makeDraggable(el, clickCallback) {

    var rect = el.getBoundingClientRect();

    else {
      if (el.id === 'stage') updateTransform(Math.max(4, Math.round((window.innerWidth - 180) / 2)), Math.max(4, Math.round((window.innerHeight - 220) / 2)));
      else updateTransform(Math.max(4, window.innerWidth - 75), 135);
    }
  }
  initPosition();

  function dragStart(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest('button,input,select,textarea,a,.btn-hide-top')) return;
    if (el._posX === undefined) initPosition();
    initialX = el._posX; initialY = el._posY; startX = e.clientX; startY = e.clientY; currentX = initialX; currentY = initialY;
    isDragging = true; hasMoved = false; el.classList.add('is-dragging'); document.body.style.cursor = 'grabbing'; el.style.cursor = 'grabbing';
    if (bgFrame) bgFrame.style.pointerEvents = 'none';
    if (el.setPointerCapture && e.pointerId !== undefined) { try { el.setPointerCapture(e.pointerId); activePointerId = e.pointerId; } catch(_){} }
    if (e.cancelable) e.preventDefault();
  }

  function dragMove(e) {
    if (!isDragging) return;

    if (!hasMoved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) hasMoved = true;
    var margin = 2;
    var w = el.offsetWidth || (el.id === 'stage' ? 180 : 54);
    var h = el.offsetHeight || (el.id === 'stage' ? 220 : 54);
    var maxLeft = Math.max(margin, window.innerWidth - w - margin);
    var maxTop = Math.max(margin, window.innerHeight - h - margin);
    var nx = Math.max(margin, Math.min(maxLeft, initialX + dx));
    var ny = Math.max(margin, Math.min(maxTop, initialY + dy));

    }
    if (e.cancelable) e.preventDefault();
  }

  function dragEnd(e) {
    if (!isDragging) return;
    isDragging = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    el.style.transform = 'translate3d(' + currentX + 'px, ' + currentY + 'px, 0)';
    el._posX = currentX; el._posY = currentY;
    el.classList.remove('is-dragging'); document.body.style.cursor = ''; el.style.cursor = 'grab';
    if (bgFrame) bgFrame.style.pointerEvents = 'auto';
    if (activePointerId !== null && el.releasePointerCapture) { try { el.releasePointerCapture(activePointerId); } catch(_){} activePointerId = null; }

  window.addEventListener('pointermove', dragMove, { passive: false });

  window.addEventListener('pointercancel', dragEnd, { passive: false });
  window.addEventListener('mousemove', dragMove, { passive: false });
  window.addEventListener('mouseup', dragEnd, { passive: false });
  el.addEventListener('touchstart', function(e){ if (e.touches && e.touches[0]) dragStart(e.touches[0]); }, { passive: true });
  window.addEventListener('touchmove', function(e){ if (e.touches && e.touches[0]) dragMove(e.touches[0]); }, { passive: false });
  window.addEventListener('touchend', dragEnd, { passive: true });
  el.addEventListener('dragstart', function(e){ e.preventDefault(); });
}
