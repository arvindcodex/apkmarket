<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{name}</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent!important;width:100vw;height:100vh;overflow:hidden;font-family:'Orbitron',sans-serif;color:#fff;-webkit-tap-highlight-color:transparent;user-select:none;pointer-events:none}
#target-game-frame{position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:-1;pointer-events:auto;background:#000}
@keyframes fab-float{0%,100%{transform:translate3d(0,0,0) rotate(-2deg)}50%{transform:translate3d(0,-3.5px,0) rotate(2deg)}}
@keyframes rotate-cw{to{transform:rotate(360deg)}}
@keyframes dot-pulse{0%,100%{transform:scale(.85);opacity:.7}50%{transform:scale(1.12);opacity:1}}
:root{--hud-scale:0.78}
@keyframes spdFadeIn{0%{opacity:0;transform:scale(calc(var(--hud-scale,0.78)*.86))}100%{opacity:1;transform:scale(var(--hud-scale,0.78))}}
@keyframes spdFadeOut{0%{opacity:1;transform:scale(var(--hud-scale,0.78))}100%{opacity:0;transform:scale(calc(var(--hud-scale,0.78)*.86))}}
@keyframes bhmPulse{0%,100%{opacity:.88;transform:scale(.98)}50%{opacity:1;transform:scale(1.02)}}
@keyframes bigTextGlow{0%,100%{opacity:.9;transform:scale(.98)}50%{opacity:1;transform:scale(1.02)}}
@keyframes glareSweep{0%{left:-140%}25%,100%{left:160%}}
#mini{position:absolute;right:20px;top:135px;width:38px;height:38px;cursor:grab;touch-action:none;z-index:2147483647;user-select:none;-webkit-tap-highlight-color:transparent;will-change:left,top;pointer-events:auto;display:flex;align-items:center;justify-content:center;transform:translateZ(0)}
#spd-fab-core{width:38px;height:38px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.25),transparent 20%),radial-gradient(circle,#063820,#020d07 75%);border:1.8px solid #00ff66;box-shadow:0 0 10px rgba(0,255,102,.6),inset 0 0 8px rgba(0,255,102,.35);overflow:hidden;animation:fab-float 3s ease-in-out infinite;transform:translateZ(0);will-change:transform}
#spd-fab-core::before{content:'';position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(transparent,#00ff66,transparent,#ffaa00,transparent);animation:rotate-cw 2.8s linear infinite;will-change:transform}
#spd-fab-core::after{content:'';position:absolute;inset:2.5px;border-radius:50%;background:#03140b;z-index:1}
#spd-fab-icon{position:relative;z-index:3;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 5px rgba(0,255,102,.5);contain:paint}
#spd-fab-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%;image-rendering:auto;transform:translateZ(0);will-change:transform}
#spd-fab-dot{position:absolute;right:-1px;top:-1px;width:9px;height:9px;border-radius:50%;background:#ff1e27;border:1.2px solid #fff;box-shadow:0 0 6px #ff1e27;z-index:5;animation:dot-pulse 1.1s infinite}
.stage-outer-laser-svg{position:absolute;top:0;left:0;width:330px;height:330px;pointer-events:none;z-index:5;overflow:visible}
.stage-laser-track{fill:none;stroke:rgba(0,255,120,.12);stroke-width:1.5px}
.stage-laser-arc-cw{fill:none;stroke:url(#hudLaserNeonGrad);stroke-width:3.5px;stroke-linecap:round;stroke-dasharray:145 715;animation:laserFlowCw 3.6s linear infinite}
.stage-laser-spark-cw{fill:none;stroke:#fff;stroke-width:3.6px;stroke-linecap:round;stroke-dasharray:24 836;animation:laserFlowCw 3.6s linear infinite}
.stage-laser-arc-ccw{fill:none;stroke:url(#hudLaserGoldGrad);stroke-width:2.6px;stroke-linecap:round;stroke-dasharray:100 760;animation:laserFlowCcw 4.8s linear infinite;opacity:.9}
#stage.is-scanning .stage-laser-arc-cw{animation-duration:.9s;stroke-width:4.2px}
#stage.is-scanning .stage-laser-spark-cw{animation-duration:.9s;stroke-width:4.5px}
#stage.is-scanning .stage-laser-arc-ccw{animation-duration:1.15s;stroke-width:3.2px}
@keyframes laserFlowCw{from{stroke-dashoffset:0}to{stroke-dashoffset:-860}}
@keyframes laserFlowCcw{from{stroke-dashoffset:0}to{stroke-dashoffset:860}}
#stage{display:none;position:absolute;left:calc(50% - 165px);top:calc(50% - 165px);width:330px;height:330px;z-index:2147483647;touch-action:none;cursor:grab;user-select:none;-webkit-tap-highlight-color:transparent;will-change:left,top,opacity,transform;pointer-events:auto;transform:scale(var(--hud-scale,0.78));transform-origin:center center;background:transparent!important}
#stage.spd-open{display:block;animation:spdFadeIn .25s cubic-bezier(.18,.89,.32,1.28) forwards}
#stage.spd-close{animation:spdFadeOut .2s ease-in forwards;pointer-events:none}
#hudBezelCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;background:transparent!important;border:none!important;outline:none!important}
.bhm-pod-housing{position:absolute;top:32px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#1c2721 0%,#0a110d 75%,#040806 100%);border:2.5px solid #293d32;box-shadow:0 4px 12px rgba(0,0,0,.9),inset 0 1px 2px rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;z-index:40;pointer-events:auto;cursor:pointer;transition:transform .16s ease,border-color .2s ease,box-shadow .2s ease}
.bhm-pod-housing:hover{transform:translateX(-50%) scale(1.06);border-color:#00ff88;box-shadow:0 0 16px rgba(0,255,136,.45),inset 0 1px 2px rgba(255,255,255,.3)}
.bhm-pod-housing:active{transform:translateX(-50%) scale(.96)}
.bhm-pod-housing.is-active{border-color:#00f7ff;box-shadow:0 0 20px rgba(0,247,255,.65),inset 0 1px 2px rgba(255,255,255,.4)}
.bhm-pod-housing.is-active .bhm-red-ring{border-color:#00f7ff;box-shadow:0 0 14px rgba(0,247,255,.7)}
.bhm-pod-housing.is-active .bhm-label{color:#fff;text-shadow:0 0 10px #00f7ff,0 0 18px #00f7ff}
.chitransh-control-box{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(6px) scale(.85);opacity:0;visibility:hidden;pointer-events:none;width:max-content;height:28px;display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border-radius:6px;background:linear-gradient(180deg,rgba(8,38,44,.98) 0%,rgba(2,16,20,.99) 100%);border:1.4px solid rgba(0,247,255,.85);box-shadow:0 0 16px rgba(0,247,255,.5),inset 0 1px 2px rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.8),0 6px 14px rgba(0,0,0,.95);overflow:hidden;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;z-index:60;white-space:nowrap;transition:opacity .24s cubic-bezier(.16,1,.3,1),transform .26s cubic-bezier(.18,.89,.32,1.28),visibility .24s ease}
.chitransh-control-box.ccp-active{opacity:1!important;visibility:visible!important;pointer-events:auto!important;transform:translateX(-50%) translateY(0) scale(1)!important}
.chitransh-control-box::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3.5px;background:linear-gradient(180deg,#00f7ff,#00ff88);box-shadow:0 0 8px #00ff88}
.chitransh-control-box::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid rgba(0,247,255,.9);filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.ccp-glint-bar{position:absolute;top:0;left:-100%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-25deg);pointer-events:none;animation:ccpGlint 3.6s ease-in-out infinite}
@keyframes ccpGlint{0%,25%{left:-100%}55%,100%{left:160%}}
.ccp-title{display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;line-height:1}
.ccp-name{font-family:'Orbitron','Rajdhani',sans-serif;font-size:11px;font-weight:900;letter-spacing:1.4px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 6px rgba(0,255,136,.5)}
.ccp-tag{font-family:'Orbitron','Rajdhani',sans-serif;font-size:9px;font-weight:800;letter-spacing:1.1px;color:#00f7ff;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 5px rgba(0,247,255,.5)}
.bhm-red-ring{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#2b0307 0%,#0d0102 80%);border:2.5px solid #ff1e2b;animation:bhmPulse 2s ease-in-out infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.bhm-red-ring::after{content:'';position:absolute;inset:3px;border-radius:50%;border:1px solid rgba(255,110,120,.55);pointer-events:none}
#ekgCanvas{width:34px;height:16px;margin-top:2px}
.bhm-label{font-family:'Orbitron',sans-serif;font-weight:900;font-size:8.5px;letter-spacing:1px;color:#fff;text-shadow:0 0 6px #ff1e2b;margin-top:1px}
.big-display-row{position:absolute;top:95px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:10px;z-index:6;pointer-events:none;width:220px}
.hud-corner-bracket{width:12px;height:16px;border-color:#00ff88;border-style:solid;filter:drop-shadow(0 0 6px #00ff66);opacity:.9}
.hud-bracket-left{border-width:2.5px 0 0 2.5px}
.hud-bracket-right{border-width:2.5px 2.5px 0 0}
#mainSignalWord{font-family:'Orbitron',sans-serif;font-weight:900;font-size:36px;letter-spacing:2px;color:#fff;line-height:1;animation:bigTextGlow 2.2s ease-in-out infinite;text-transform:uppercase}
.center-b-housing{position:absolute;top:136px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#072b1a 0%,#03140c 100%);border:1.8px solid rgba(0,255,120,.45);box-shadow:0 0 12px rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:6;pointer-events:none}
.center-b-sphere{width:35px;height:35px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ff7a7a 0%,#ff1a25 32%,#a80008 75%,#4a0004 100%);border:1.5px solid #ff8080;box-shadow:0 0 14px rgba(255,25,40,.85),inset 0 -3px 6px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;position:relative}
.center-b-sphere::before{content:'';position:absolute;top:3px;left:6px;width:15px;height:7px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0));transform:rotate(-18deg)}
#centerOrbChar{font-family:'Orbitron',sans-serif;font-weight:900;font-size:19px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7);line-height:1}
#waveCanvas{position:absolute;top:179px;left:50%;transform:translateX(-50%);width:140px;height:22px;z-index:6;pointer-events:none}
.period-pill-box{position:absolute;top:206px;left:50%;transform:translateX(-50%);height:23px;padding:0 16px;border-radius:20px;background:rgba(2,28,16,.92);border:1.5px solid #00ff77;box-shadow:0 0 12px rgba(0,255,119,.4),inset 0 0 7px rgba(0,255,119,.25);display:flex;align-items:center;justify-content:center;gap:8px;z-index:6;pointer-events:none;white-space:nowrap;transition:border-color .25s ease, box-shadow .25s ease, background .25s ease}
.period-lbl{font-family:'Orbitron',sans-serif;font-weight:800;font-size:9.5px;letter-spacing:1.2px;color:#2aff95;transition:color .25s ease}
#periodSeqVal{font-family:'Orbitron',sans-serif;font-weight:900;font-size:11px;letter-spacing:1.5px;color:#fff;text-shadow:0 0 6px rgba(255,255,255,.6);transition:color .25s ease}
.hud-bottom-btnbar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:288px;height:44px;display:flex;justify-content:space-between;gap:8px;z-index:12}
.chamfer-btn{position:relative;height:100%;border:none;background:transparent;cursor:pointer;outline:none;padding:0;display:flex;align-items:center;justify-content:center;transition:transform .15s ease,filter .2s ease;clip-path:polygon(8px 0%,calc(100% - 8px) 0%,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0% calc(100% - 8px),0% 8px);overflow:hidden}
.chamfer-btn::after{content:'';position:absolute;top:0;left:-140%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-25deg);animation:glareSweep 4.8s infinite;pointer-events:none}
.chamfer-btn:hover{transform:translateY(-1.5px);filter:brightness(1.14)}
.chamfer-btn:active{transform:translateY(1px) scale(.98)}
.chamfer-btn:disabled{filter:grayscale(.7) opacity(.65);cursor:not-allowed}
#spd-start{flex:1.32;filter:drop-shadow(0 0 10px rgba(0,255,102,.55))}
#spd-hide{flex:.98;filter:drop-shadow(0 0 10px rgba(255,170,0,.45))}
.btn-svg-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.btn-content{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:0 10px}
.btn-label{font-family:'Orbitron',sans-serif;font-weight:900;font-size:11.5px;letter-spacing:1px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.btn-arrows{font-family:'Orbitron',sans-serif;font-weight:900;font-size:14px;line-height:1}
.hud-scanner-overlay{position:absolute;left:52px;top:44px;width:226px;height:226px;border-radius:50%;overflow:hidden;pointer-events:none;z-index:5;opacity:0;transition:opacity .25s ease;will-change:opacity;contain:strict}
#stage.is-scanning .hud-scanner-overlay{opacity:1}
.scan-grid-matrix{position:absolute;inset:0;background-image:linear-gradient(rgba(0,255,136,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,.08) 1px,transparent 1px);background-size:16px 16px;background-position:center center;border-radius:50%;opacity:.35}
#stage.is-scanning .scan-grid-matrix{animation:gridPulse 1.2s ease-in-out infinite alternate}
@keyframes gridPulse{0%{opacity:.25}100%{opacity:.65}}
.scan-pulse-ring{position:absolute;left:50%;top:50%;width:44px;height:44px;margin-left:-22px;margin-top:-22px;border-radius:50%;border:1.8px solid #00f7ff;box-shadow:0 0 10px #00f7ff,inset 0 0 6px rgba(0,255,136,.4);pointer-events:none;opacity:0;will-change:transform,opacity}
#stage.is-scanning .scan-pulse-ring.ring-1{animation:sonarPulseWave 1.8s cubic-bezier(.1,.65,.3,1) infinite}
#stage.is-scanning .scan-pulse-ring.ring-2{animation:sonarPulseWave 1.8s cubic-bezier(.1,.65,.3,1) infinite .9s}
@keyframes sonarPulseWave{0%{transform:scale(.65);opacity:.95}100%{transform:scale(4.8);opacity:0}}
.scan-laser-beam{position:absolute;left:0;width:100%;height:40px;top:0;background:linear-gradient(180deg,transparent 0%,rgba(0,255,170,.06) 25%,rgba(0,255,234,.4) 80%,#00ffff 95%,rgba(255,255,255,.95) 98%,rgba(0,255,200,.3) 100%);box-shadow:0 0 14px #00ffff,0 0 28px rgba(0,255,136,.6);pointer-events:none;transform:translateY(-40px);will-change:transform}
#stage.is-scanning .scan-laser-beam{animation:cyberLaserScan 1.6s cubic-bezier(.45,.05,.55,.95) infinite alternate}
@keyframes cyberLaserScan{0%{transform:translateY(-5px)}100%{transform:translateY(192px)}}
.scan-target-reticle{position:absolute;left:50%;top:50%;width:62px;height:62px;margin-left:-31px;margin-top:-31px;border:1.5px dashed rgba(0,255,234,.7);border-radius:50%;pointer-events:none;opacity:0;will-change:transform,opacity}
#stage.is-scanning .scan-target-reticle{opacity:1;animation:reticleSpinCW 3s linear infinite}
@keyframes reticleSpinCW{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#stage.is-scanning .hud-corner-bracket{border-color:#00ffff!important;filter:drop-shadow(0 0 8px #00f7ff)!important;animation:bracketLockPulse .45s ease-in-out infinite alternate}
@keyframes bracketLockPulse{0%{transform:scale(.95);opacity:.75}100%{transform:scale(1.15);opacity:1}}
#stage.is-scanning #mainSignalWord{animation:scanningTextGlow .45s ease-in-out infinite alternate!important;letter-spacing:2.5px}
@keyframes scanningTextGlow{0%{color:#00ffaa;text-shadow:0 0 10px #00ff88,0 0 20px #00ff88}100%{color:#00ffff;text-shadow:0 0 16px #00ffff,0 0 30px #00f7ff}}
#stage.is-scanning .center-b-sphere{animation:orbScanPulse .6s ease-in-out infinite alternate}
@keyframes orbScanPulse{0%{box-shadow:0 0 12px rgba(255,25,40,.85);filter:brightness(1)}100%{box-shadow:0 0 22px rgba(255,40,60,1),0 0 32px rgba(0,255,234,.65);filter:brightness(1.25)}}
#stage.is-scanning .bhm-red-ring{animation:bhmPulseScan .65s ease-in-out infinite!important;border-color:#00f7ff!important}
@keyframes bhmPulseScan{0%,100%{box-shadow:0 0 14px #00f7ff,inset 0 0 10px rgba(0,247,255,.55)}50%{box-shadow:0 0 26px #00ffff,0 0 36px #00f7ff,inset 0 0 16px #00ffff}}
#stage.is-scanning .bhm-label{color:#00ffff!important;text-shadow:0 0 8px #00ffff!important}
.btn-laser-runner{opacity:0;pointer-events:none;transition:opacity .25s ease;will-change:stroke-dashoffset}
.btn-scan-fx{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;overflow:hidden;transition:opacity .25s ease;contain:strict}
.btn-scan-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,247,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(0,247,255,.12) 1px,transparent 1px);background-size:6px 6px;opacity:.8}
.btn-scan-beam{position:absolute;top:-10px;bottom:-10px;left:0;width:52px;background:linear-gradient(90deg,transparent 0%,rgba(0,247,255,.15) 15%,rgba(0,255,255,.65) 45%,rgba(255,255,255,.98) 50%,rgba(0,255,255,.65) 55%,rgba(0,255,136,.2) 85%,transparent 100%);filter:drop-shadow(0 0 8px #00ffff);transform:translateX(-70px) skewX(-20deg);will-change:transform}
.chamfer-btn#spd-start.is-scanning{cursor:wait;animation:btnScanBreathing .9s ease-in-out infinite alternate}
@keyframes btnScanBreathing{0%{filter:drop-shadow(0 0 8px rgba(0,247,255,.75))}100%{filter:drop-shadow(0 0 14px rgba(0,255,255,.9))}}
.chamfer-btn#spd-start.is-scanning ~ #spd-hide{opacity:.65;filter:drop-shadow(0 0 4px rgba(255,170,0,.25));transition:opacity .3s ease,filter .3s ease}
.chamfer-btn#spd-start.is-scanning .btn-bg-poly{fill:url(#gBtnBgScan)!important;stroke:rgba(0,247,255,.65)!important}
.chamfer-btn#spd-start.is-scanning .btn-inner-border{stroke:rgba(0,255,255,.45)!important}
.chamfer-btn#spd-start.is-scanning .btn-laser-runner.btn-laser-outer{opacity:1;stroke:#00ffff;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:85 296;filter:drop-shadow(0 0 5px #00ffff);animation:btnLaserTraceCw .85s linear infinite}
.chamfer-btn#spd-start.is-scanning .btn-laser-runner.btn-laser-inner{opacity:.9;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:45 314;filter:drop-shadow(0 0 4px #00ffff);animation:btnLaserTraceCcw 1.15s linear infinite}
@keyframes btnLaserTraceCw{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-381px}}
@keyframes btnLaserTraceCcw{0%{stroke-dashoffset:0}100%{stroke-dashoffset:359px}}
.chamfer-btn#spd-start.is-scanning .btn-scan-fx{opacity:1}
.chamfer-btn#spd-start.is-scanning .btn-scan-beam{animation:btnHoloLaserSweep .95s cubic-bezier(.4,0,.2,1) infinite}
@keyframes btnHoloLaserSweep{0%{transform:translateX(-70px) skewX(-20deg);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(190px) skewX(-20deg);opacity:0}}
.chamfer-btn#spd-start.is-scanning .btn-eq-bars{filter:drop-shadow(0 0 6px #00ffff) drop-shadow(0 0 10px rgba(0,255,136,.8))!important}
.chamfer-btn#spd-start.is-scanning .eq-b{transform-box:fill-box;transform-origin:bottom center;will-change:transform,fill}
.chamfer-btn#spd-start.is-scanning .eq-b1{animation:eqSurge1 .38s ease-in-out infinite alternate!important}
.chamfer-btn#spd-start.is-scanning .eq-b2{animation:eqSurge2 .3s ease-in-out infinite alternate!important}
.chamfer-btn#spd-start.is-scanning .eq-b3{animation:eqSurge3 .44s ease-in-out infinite alternate!important}
.chamfer-btn#spd-start.is-scanning .eq-b4{animation:eqSurge4 .26s ease-in-out infinite alternate!important}
@keyframes eqSurge1{0%{transform:scaleY(.45);fill:#00ff88;opacity:.6}50%{fill:#00ffff}100%{transform:scaleY(1.7);fill:#fff;opacity:1}}
@keyframes eqSurge2{0%{transform:scaleY(1.35);fill:#00ffff;opacity:.9}50%{fill:#fff}100%{transform:scaleY(.4);fill:#00ff88;opacity:.5}}
@keyframes eqSurge3{0%{transform:scaleY(.55);fill:#00f7ff;opacity:.6}60%{fill:#fff}100%{transform:scaleY(1.5);fill:#00ff88;opacity:1}}
@keyframes eqSurge4{0%{transform:scaleY(1.45);fill:#fff;opacity:1}40%{fill:#00ffff}100%{transform:scaleY(.35);fill:#00ff77;opacity:.6}}
.chamfer-btn#spd-start.is-scanning #analyzeBtnText{color:#fff!important;text-shadow:0 0 8px #00ffff,0 0 16px rgba(0,247,255,.85),0 0 24px #00ff88!important;animation:btnTextScanPulse .55s ease-in-out infinite alternate}

    ectx.beginPath(); ectx.strokeStyle = isWorking ? '#00f7ff' : '#ff2a3a'; ectx.lineWidth = 2.4; ectx.lineCap = 'round'; ectx.lineJoin = 'round';
    var pts = [[4, 17], [18, 17], [23, 17], [27, 7], [32, 26], [37, 4], [42, 23], [46, 17], [64, 17]];
    var spikeMult = isWorking ? 2.2 : 1.0;
    for (var pi = 0; pi < pts.length; pi++) {
        var pt = pts[pi];
        var waveY = (pi > 1 && pi < 7) ? 17 + (pt[1] - 17) * spikeMult + Math.sin(ekgOffset + pi) * (isWorking ? 3.2 : 1.8) : pt[1];
        if (pi === 0) ectx.moveTo(pt[0], waveY); else ectx.lineTo(pt[0], waveY);
    }
    ectx.stroke();
    wctx.clearRect(0, 0, 280, 44);
    var bars = 27, barSpacing = 8.2, startX = (280 - (bars - 1) * barSpacing) / 2;
    for (var bi = 0; bi < bars; bi++) {
        var distFromCenter = Math.abs(bi - (bars - 1) / 2) / ((bars - 1) / 2);
        var envelope = Math.pow(1 - distFromCenter, 1.45);
        var dynamic = 0.45 + 0.55 * Math.abs(Math.sin(wavePhase + bi * 0.55));
        var h = Math.max(3, envelope * dynamic * (isWorking ? 40 : 36));
        var x = startX + bi * barSpacing, y = 22 - h / 2;
        wctx.fillStyle = distFromCenter < 0.22 ? '#ffffff' : (isWorking ? '#00f7ff' : '#00ff88');
        wctx.fillRect(x - 1.5, y, 3, h);
    }
    radarAngle += radarSpeed; ekgOffset += isWorking ? 0.28 : 0.12; wavePhase += isWorking ? 0.32 : 0.1;
}

function setBtn(text, fn) { analyzeBtnText.innerText = text; startBtn.onclick = fn; startBtn.disabled = !fn; }
function setBtnByState() {
    if (isWorking) { setBtn("SCANNING...", null); return; }
    if (curState === 'wait') setBtn("REGISTER", function () { navTo(REGISTER_URL); });
    else if (curState === 'low') setBtn("DEPOSIT", function () { navTo(DEPOSIT_URL); });
    else if (curState === 'home') setBtn("OPEN WINGO", function () { navTo(WINGO_URL); });
    else if (curState === 'wingo') setBtn("ANALYZE", runInjection);
    else setBtn("ANALYZE", runInjection);
}

function updateUI() {
    if (isWorking) return;
    setBtnByState();
    stage.classList.remove('is-locked', 'is-deposit');
    mainSignalWord.classList.remove('is-locked', 'is-deposit', 'is-standby');
    centerOrbChar.classList.remove('is-locked', 'is-deposit', 'is-standby');
    if (periodLblEl) periodLblEl.textContent = 'PERIOD';

    if (curState === 'wait') {
        stage.classList.add('is-standby', 'is-locked');
        mainSignalWord.classList.add('is-locked');
        centerOrbChar.classList.add('is-locked');
        periodSeqVal.classList.add('is-standby');
        mainSignalWord.innerText = "LOCKED";
        mainSignalWord.style.fontSize = "";
        mainSignalWord.style.color = "";
        centerOrbChar.innerText = "!";
        periodSeqVal.innerText = "----";
    } else if (curState === 'low') {
        stage.classList.add('is-deposit');
        mainSignalWord.classList.add('is-deposit');
        centerOrbChar.classList.add('is-deposit');
        periodSeqVal.classList.remove('is-standby');
        mainSignalWord.innerText = "DEPOSIT";
        mainSignalWord.style.fontSize = "";
        mainSignalWord.style.color = "";
        centerOrbChar.innerText = "₹";
        /* ⬇️ Show MIN DEPOSIT ₹{deposit} in period pill */
        if (periodLblEl) periodLblEl.textContent = 'MIN DEPOSIT';
        periodSeqVal.innerText = '₹' + (minDeposit || {deposit});
    } else if (curState === 'home') {
        stage.classList.add('is-standby');
        mainSignalWord.classList.add('is-standby');
        centerOrbChar.classList.add('is-standby');
        periodSeqVal.classList.add('is-standby');
        mainSignalWord.innerText = "READY";
        mainSignalWord.style.fontSize = "26px";
        mainSignalWord.style.color = "#00ffaa";
        centerOrbChar.innerText = "✦";
        periodSeqVal.innerText = "----";
    } else if (curState === 'wingo') {
        if (!wingoHackDone) {
            stage.classList.add('is-standby');
            mainSignalWord.classList.add('is-standby');
            centerOrbChar.classList.add('is-standby');
            periodSeqVal.classList.add('is-standby');
            mainSignalWord.innerText = "READY";
            mainSignalWord.style.fontSize = "26px";
            mainSignalWord.style.color = "#00ffaa";
            centerOrbChar.innerText = "✦";
            periodSeqVal.innerText = lastPeriod ? lastPeriod.slice(-4) : "----";
        }
    }
}

async function runInjection() {
    if (isWorking) return;
    if (curState !== 'wingo') { setBtnByState(); return; }
    if (fbDepositCondition && !everMetMin && lastBalance >= 0 && lastBalance < minDeposit) { _goState('low'); return; }
    isWorking = true; wingoHackDone = false; lockedPrediction = null; lockedPeriod = null;
    stage.classList.remove('is-standby', 'is-locked', 'is-deposit', 'result-is-big', 'result-is-small', 'result-reveal-active');
    mainSignalWord.classList.remove('is-standby', 'is-locked', 'is-deposit');
    centerOrbChar.classList.remove('is-standby', 'is-locked', 'is-deposit');
    periodSeqVal.classList.remove('is-standby');
    stage.classList.add('is-scanning'); startBtn.classList.add('is-scanning');
    radarSpeed = 0.095; badge.innerText = "SCAN"; setBtn("SCANNING...", null);
    mainSignalWord.style.fontSize = "22px"; mainSignalWord.style.color = "#00ffff";
    var predPromise = (async function () {
        try { await fetchPeriod(); } catch (e) {}
        var digit = lastPeriod ? parseInt(lastPeriod.toString().slice(-1)) : Math.floor(Math.random() * 10);
        return LOGIC[digit] || LOGIC[Math.floor(Math.random() * 10)];
    })();
    var SCAN_DURATION_MS = 3200, startTime = Date.now();
    var STAGES = [{ t: 0, txt: "INIT PORT" }, { t: 450, txt: "ENCRYPT" }, { t: 1000, txt: "FETCHING" }, { t: 1600, txt: "DECODING" }, { t: 2200, txt: "0xDD41" }, { t: 2700, txt: "PARSING" }, { t: 3000, txt: "LOCKED!" }];
    var scanTimer = setInterval(function () {
        var elapsed = Date.now() - startTime;
        for (var i = STAGES.length - 1; i >= 0; i--) { if (elapsed >= STAGES[i].t) { mainSignalWord.innerText = STAGES[i].txt; break; } }
        centerOrbChar.innerText = Math.floor(Math.random() * 10);
        periodSeqVal.innerText = Math.floor(1000 + Math.random() * 9000);
        if (elapsed >= SCAN_DURATION_MS) {
            clearInterval(scanTimer);
            predPromise.then(function (pred) {
                lockedPrediction = pred; lockedPeriod = lastPeriod; wingoHackDone = true;
                showResult(pred);
                playAudio(pred.s === 'BIG' ? 'big.mp3' : 'small.mp3');
                try { window.ZAYRO.speak(pred.s + ' ' + pred.n); } catch (e) {}
            });
        }
    }, 80);
}
function showResult(pred) {
    stage.classList.remove('is-scanning', 'is-standby', 'is-locked', 'is-deposit');
    mainSignalWord.classList.remove('is-standby', 'is-locked', 'is-deposit');
    centerOrbChar.classList.remove('is-standby', 'is-locked', 'is-deposit');
    periodSeqVal.classList.remove('is-standby');
    startBtn.classList.remove('is-scanning'); radarSpeed = 0.022; badge.innerText = "CCP";
    mainSignalWord.innerText = pred.s; mainSignalWord.style.fontSize = pred.s === "SMALL" ? "27px" : "36px"; mainSignalWord.style.color = "#ffffff";
    stage.classList.remove('result-is-big', 'result-is-small');
    stage.classList.add(pred.s === "BIG" ? 'result-is-big' : 'result-is-small');
    stage.classList.remove('result-reveal-active'); void stage.offsetWidth; stage.classList.add('result-reveal-active');
    centerOrbChar.innerText = pred.n;
    periodSeqVal.innerText = lastPeriod ? lastPeriod.slice(-4) : '----';
    isWorking = false; setBtnByState();
}

function makeDraggable(el, clickCallback) {
    var sx = 0, sy = 0, ox = 0, oy = 0, isDragging = false, hasMoved = false, minX = 0, maxX = 0, minY = 0, maxY = 0;
    function touchStart(e) {
        if (e.target.tagName.toLowerCase() === 'button' || e.target.closest('button') || e.target.closest('.bhm-pod-housing') || e.target.closest('.chitransh-control-box') || e.target.closest('#warnOverlay') || e.target.closest('#warnRegBtn')) return;
        var p = e.touches ? e.touches[0] : e;
        sx = p.clientX; sy = p.clientY;
        var comp = window.getComputedStyle(el);
        ox = parseInt(comp.left, 10) || 0; oy = parseInt(comp.top, 10) || 0;
        isDragging = true; hasMoved = false; el.style.transition = 'none';
        var scale = 1;
        var trMatch = comp.transform.match(/matrix\(([^,]+)/);
        if (trMatch && !isNaN(parseFloat(trMatch[1]))) scale = parseFloat(trMatch[1]);
        var visualW = el.offsetWidth * scale, visualH = el.offsetHeight * scale;
        var padX = (el.offsetWidth - visualW) / 2, padY = (el.offsetHeight - visualH) / 2;
        minX = 4 - padX; maxX = window.innerWidth - el.offsetWidth - 4 + padX;
        minY = 4 - padY; maxY = window.innerHeight - el.offsetHeight - 4 + padY;
    }
    function touchMove(e) {
        if (!isDragging) return;
        var p = e.touches ? e.touches[0] : e;
        var dx = p.clientX - sx, dy = p.clientY - sy;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;
        el.style.left = Math.max(minX, Math.min(maxX, ox + dx)) + 'px';
        el.style.top = Math.max(minY, Math.min(maxY, oy + dy)) + 'px';
        if (e.cancelable) e.preventDefault();
    }
    function touchEnd() {
        if (!isDragging) return;
        isDragging = false;
        el.style.transition = "left 0.1s ease-out, top 0.1s ease-out";
        if (!hasMoved && typeof clickCallback === 'function') clickCallback();
        setTimeout(function () { el.style.transition = ''; }, 150);
    }
    el.addEventListener("touchstart", touchStart, { passive: false });
    document.addEventListener("touchmove", touchMove, { passive: false });
    document.addEventListener("touchend", touchEnd, { passive: false });
    el.addEventListener("mousedown", touchStart, false);
    document.addEventListener("mousemove", touchMove, false);
    document.addEventListener("mouseup", touchEnd, false);
}

function openCard() {
    if (opened) return;
    opened = true; mini.style.display = 'none';
    stage.style.display = 'block'; stage.classList.remove('spd-close'); stage.classList.add('spd-open');
    setBtnByState(); updateUI();
    if (!isHudRendering) { isHudRendering = true; requestAnimationFrame(renderHUDFrame); }
}
function closeCard() {
    if (!opened) return;
    opened = false; isHudRendering = false;
    stage.classList.remove('spd-open'); stage.classList.add('spd-close');
    mini.style.display = 'flex';
    setTimeout(function () { if (!opened) { stage.style.display = 'none'; stage.classList.remove('spd-close'); } }, 250);
}

var ccpDismissTimer = null;
function triggerChitranshBox(e) {
    if (e) e.stopPropagation();
    if (!chitranshBox || !ccpPodBtn) return;
    if (ccpDismissTimer) clearTimeout(ccpDismissTimer);
    chitranshBox.classList.remove("ccp-active"); void chitranshBox.offsetWidth; chitranshBox.classList.add("ccp-active");
    ccpPodBtn.classList.add("is-active");
    ccpDismissTimer = setTimeout(function () { chitranshBox.classList.remove("ccp-active"); ccpPodBtn.classList.remove("is-active"); }, 2000);
}
if (ccpPodBtn) { ccpPodBtn.addEventListener("click", triggerChitranshBox); ccpPodBtn.addEventListener("touchend", function (e) { e.stopPropagation(); triggerChitranshBox(e); }); }
document.addEventListener("click", function (e) {
    if (ccpPodBtn && !ccpPodBtn.contains(e.target)) {
        if (chitranshBox) chitranshBox.classList.remove("ccp-active");
        ccpPodBtn.classList.remove("is-active");
        if (ccpDismissTimer) clearTimeout(ccpDismissTimer);
    }
});

(function () {
    var el = document.getElementById('warnRegBtn');
    if (!el) return;
    var handling = false;
    var exec = function (e) {
        if (e) { try { e.preventDefault(); e.stopPropagation(); } catch (err) {} }
        if (handling) return; handling = true;
        hideWarnOverlay(); navTo(REGISTER_URL);
        setTimeout(function () { handling = false; }, 400);
    };
    el.addEventListener('click', exec);
    el.addEventListener('touchend', function (e) { if (e.cancelable) { try { e.preventDefault(); } catch (err) {} } exec(e); }, { passive: false });
})();

hideBtn.onclick = closeCard;
setBtnByState();
makeDraggable(mini, openCard);
makeDraggable(stage, null);

window.onload = function () {
    _goState('wait');
    gameFrame.src = REGISTER_URL;
    fetchPeriod();
    setInterval(fetchPeriod, 2500);
    setBtnByState();
    setTimeout(function () { openCard(); }, 300);
    setTimeout(function () { _initDone = true; }, 2000);
};
