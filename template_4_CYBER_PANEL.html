<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{name} Signal — VIP Apex</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent !important;
  width: 100vw; height: 100vh;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  color: #fff;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  pointer-events: none;
}

/* ── Game iframe (fills screen behind everything) ── */
#target-game-frame {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  border: none;
  z-index: -1;
  pointer-events: auto;
  background: #000;
}

/* ── Shared animations ── */
@keyframes fab-float { 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-4px) rotate(2deg);} }
@keyframes rotate-cw { to { transform: rotate(360deg); } }
@keyframes rotate-ccw { to { transform: rotate(-360deg); } }
@keyframes dot-pulse { 0%,100%{transform:scale(.85);opacity:.7;} 50%{transform:scale(1.15);opacity:1;} }
@keyframes spdFadeIn { 0%{opacity:0;transform:scale(.92);} 100%{opacity:1;transform:scale(1);} }
@keyframes spdFadeOut { 0%{opacity:1;transform:scale(1);} 100%{opacity:0;transform:scale(.9);} }
@keyframes borderFlowCw { 0%{stroke-dashoffset:0;} 100%{stroke-dashoffset:-1000;} }
@keyframes borderFlowCcw { 0%{stroke-dashoffset:0;} 100%{stroke-dashoffset:1000;} }
@keyframes ring-spin { to { transform: rotate(360deg); } }
@keyframes ring-spin-rev { to { transform: rotate(-360deg); } }
@keyframes scanFloat { 0%,100%{transform:translateY(0);opacity:.6;} 50%{transform:translateY(-3px);opacity:1;} }
@keyframes flowBtnGrad { 0%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
@keyframes glareSweep { 0%{left:-150%;} 20%{left:150%;} 100%{left:150%;} }
@keyframes coinPulse { 0%,100%{box-shadow:0 0 14px rgba(255,200,50,.9),0 0 30px rgba(255,150,0,.5),inset 0 -3px 8px rgba(120,50,0,.7),inset 0 2px 6px rgba(255,255,220,.9);} 50%{box-shadow:0 0 22px rgba(255,220,70,1),0 0 42px rgba(255,160,0,.7),inset 0 -3px 8px rgba(120,50,0,.7),inset 0 2px 6px rgba(255,255,220,.95);} }

/* ── Mini FAB ── */
#mini {
  display: flex;
  position: absolute; left: 20px; top: 100px;
  width: 50px; height: 50px;
  cursor: pointer; touch-action: none;
  z-index: 2147483647; user-select: none;
  pointer-events: auto; will-change: left, top;
  animation: fab-float 3.4s ease-in-out infinite;
}
#mini:active { cursor: grabbing; }
#fab-core {
  width: 46px; height: 46px; border-radius: 50%; position: relative;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 35% 25%, rgba(255,255,255,.25), transparent 20%), radial-gradient(circle, #180A24, #08050D 75%);
  border: 2px solid #C026FF;
  box-shadow: 0 0 14px rgba(192,38,255,.75), inset 0 0 10px rgba(192,38,255,.4);
  overflow: hidden; animation: fab-float 3s ease-in-out infinite;
}
#fab-core:before {
  content: ''; position: absolute; inset: -6px; border-radius: 50%;
  background: conic-gradient(transparent, #7900FF, transparent, #F05BFF, transparent);
  animation: rotate-cw 2.8s linear infinite;
}
#fab-core:after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #08050D; z-index: 1; }
#fab-icon { position: relative; z-index: 3; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#fab-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; filter: drop-shadow(0 0 4px #C026FF); }
#fab-dot { position: absolute; right: 0; top: 0; width: 9px; height: 9px; border-radius: 50%; background: #F05BFF; box-shadow: 0 0 10px #C026FF; z-index: 5; animation: dot-pulse 1.1s infinite; }

/* ── Stage (panel) ── */
#stage {
  display: none; position: absolute;
  left: calc(50% - 90px); top: calc(50% - 110px);
  width: 180px; height: 220px; min-height: 220px; max-height: 220px;
  z-index: 2147483647; touch-action: none; cursor: grab;
  user-select: none; -webkit-user-select: none; border-radius: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,.9), 0 0 8px rgba(192,38,255,.25);
  pointer-events: auto; will-change: left, top;
}
#stage:active { cursor: grabbing; }
#stage.spd-open { display: block; animation: spdFadeIn .25s ease-out forwards; }
#stage.spd-close { animation: spdFadeOut .2s ease-in forwards; pointer-events: none; }

.border-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; border-radius: 14px; }
.stream-base,.stream-1,.stream-2,.stream-3 { fill: none; stroke-linecap: round; }
.stream-base { stroke: rgba(192,38,255,.2); stroke-width: 1.2px; }
.stream-1 { stroke: #C026FF; stroke-width: 1.5px; stroke-dasharray: 140 860; filter: drop-shadow(0 0 3px #C026FF); animation: borderFlowCw 3.2s linear infinite; }
.stream-2 { stroke: #F05BFF; stroke-width: 1.5px; stroke-dasharray: 110 890; filter: drop-shadow(0 0 3px #F05BFF); animation: borderFlowCcw 2.5s linear infinite; }
.stream-3 { stroke: #7900FF; stroke-width: 1.4px; stroke-dasharray: 90 910; filter: drop-shadow(0 0 3px #7900FF); animation: borderFlowCw 4.2s linear infinite; }

.stage-wrapper {
  position: absolute; inset: 0; border-radius: 14px;
  background: radial-gradient(circle at 50% 25%, #180A24 0%, #0d0614 50%, #08050D 100%);
  border: 1.2px solid rgba(192,38,255,.75);
  box-shadow: inset 0 0 12px rgba(192,38,255,.2), 0 0 5px rgba(192,38,255,.2);
  padding: 6px 7px 7px;
  display: flex; flex-direction: column;
  overflow: hidden; z-index: 1;
  animation: borderAuraPulse 4s ease-in-out infinite alternate;
}
@keyframes borderAuraPulse {
  0% { border-color: rgba(192,38,255,.75); box-shadow: inset 0 0 12px rgba(192,38,255,.2), 0 0 4px rgba(192,38,255,.15); }
  50% { border-color: rgba(240,91,255,.85); box-shadow: inset 0 0 14px rgba(240,91,255,.25), 0 0 5px rgba(240,91,255,.2); }
  100% { border-color: rgba(121,0,255,.75); box-shadow: inset 0 0 12px rgba(121,0,255,.2), 0 0 4px rgba(121,0,255,.15); }
}

.panel-grid {
  position: absolute; inset: 0;
  background-image: linear-gradient(rgba(192,38,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(192,38,255,.05) 1px, transparent 1px);
  background-size: 10px 10px; pointer-events: none; z-index: 2;
}
.hex-tex {
  position: absolute; right: 5px; top: 4px; width: 45px; height: 45px; opacity: .2;
  pointer-events: none; z-index: 2;
  background-image: radial-gradient(circle, #C026FF 1px, transparent 1px);
  background-size: 6px 6px;
  -webkit-mask-image: radial-gradient(circle at top right, #000 30%, transparent 75%);
  mask-image: radial-gradient(circle at top right, #000 30%, transparent 75%);
}
.rain-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 3; border-radius: 14px;
  opacity: 0.92; mix-blend-mode: screen;
}

/* ── Shared header ── */
.stage-header {
  position: relative; z-index: 5;
  display: flex; justify-content: center; align-items: center;
  padding: 4px 8px;
  border: 1.2px solid #C026FF; border-radius: 6px;
  background: linear-gradient(135deg, rgba(121,0,255,0.45) 0%, rgba(24,10,36,0.95) 50%, rgba(192,38,255,0.35) 100%);
  box-shadow: 0 0 12px rgba(192,38,255,0.35), inset 0 0 8px rgba(192,38,255,0.2);
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
  flex: 0 0 auto;
}
.title-group { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.sub-title {
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 10.5px;
  letter-spacing: 1.5px; color: #fff;
  text-shadow: 0 0 10px #C026FF, 0 0 20px #F05BFF;
  text-transform: uppercase;
}

/* ── Panel views (auth / locked / main) ── */
.panel-view {
  display: none; flex: 1;
  flex-direction: column; justify-content: space-between;
  position: relative; z-index: 5;
  min-height: 0;
}
.panel-view.active { display: flex; }

#view-auth, #view-locked {
  justify-content: space-between;
  align-items: center;
  text-align: center;
  padding: 2px 0;
}
.view-body {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  gap: 4px; width: 100%;
}
.lock-icon-wrap {
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle, rgba(192,38,255,0.28), rgba(8,5,13,0.9));
  border: 1.5px solid #C026FF;
  box-shadow: 0 0 14px rgba(192,38,255,0.5), inset 0 0 8px rgba(192,38,255,0.3);
  color: #F05BFF; margin-bottom: 4px;
  animation: lockPulse 2s ease-in-out infinite;
}
@keyframes lockPulse {
  0%,100% { box-shadow: 0 0 12px rgba(192,38,255,0.4), inset 0 0 6px rgba(192,38,255,0.2); }
  50% { box-shadow: 0 0 22px rgba(240,91,255,0.8), inset 0 0 12px rgba(240,91,255,0.4); }
}
.view-title {
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 11px;
  letter-spacing: 1px; color: #fff;
  text-shadow: 0 0 10px #C026FF, 0 0 20px #F05BFF;
}
.view-sub {
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 8px;
  letter-spacing: 0.8px; color: #F05BFF;
  text-shadow: 0 0 8px rgba(240,91,255,0.7);
}

/* ── Buttons ── */
.btn-single {
  flex: 1; height: 28px;
  border: 1.5px solid #C026FF; border-radius: 7px;
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 9px;
  letter-spacing: 1.2px; color: #fff;
  text-shadow: 0 0 8px rgba(192,38,255,0.9);
  background: linear-gradient(90deg, #180A24 0%, #7900FF 30%, #C026FF 50%, #7900FF 70%, #180A24 100%);
  background-size: 250% 100%;
  animation: flowBtnGrad 4s linear infinite;
  box-shadow: 0 0 14px rgba(192,38,255,0.5), inset 0 1px 2px rgba(255,255,255,0.3);
  clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%, 0 50%);
  cursor: pointer; transition: transform 0.15s ease;
}
.btn-single:active { transform: scale(0.95); }

/* NEW: chhota HIDE (✕) button — sabhi views me */
.btn-hide-sm {
  flex: 0 0 34px; height: 28px;
  border: 1.5px solid #F05BFF; border-radius: 7px;
  background: linear-gradient(180deg, rgba(240,91,255,0.55) 0%, rgba(121,0,255,0.85) 50%, rgba(8,5,13,0.98) 100%);
  color: #fff; font-family: 'Orbitron', sans-serif; font-weight: 900;
  font-size: 13px; cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 10px rgba(240,91,255,0.55), inset 0 0 6px rgba(240,91,255,0.35);
  text-shadow: 0 0 8px rgba(240,91,255,0.9);
  clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 50%, calc(100% - 5px) 100%, 5px 100%, 0 50%);
  transition: transform 0.15s ease;
}
.btn-hide-sm:active { transform: scale(0.88); }

/* ── Main view (design01 content) ── */
.mid-row { position: relative; z-index: 5; display: flex; gap: 5px; height: 86px; flex: 0 0 auto; }

.coin-side {
  position: relative; flex: 0 0 70px; height: 100%;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid #C026FF; border-radius: 9px;
  background: radial-gradient(circle at 50% 50%, rgba(121,0,255,.35), rgba(8,5,13,.9));
  overflow: hidden;
  box-shadow: 0 0 8px rgba(192,38,255,0.35), inset 0 0 10px rgba(121,0,255,0.2);
}
.ring { position: absolute; border-radius: 50%; }
.ring-dots { width: 68px; height: 68px; animation: ring-spin 14s linear infinite; }
.ring-dots:before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 1.5px dotted rgba(240,91,255,.7); }
.ring-ticks { width: 56px; height: 56px; animation: ring-spin-rev 10s linear infinite; }
.ring-ticks:before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed rgba(192,38,255,.55); }

.orbital-ring {
  position: absolute; top: calc(50% - 34px); left: calc(50% - 34px);
  width: 68px; height: 68px; border-radius: 50%;
  pointer-events: none; z-index: 6;
  transform-origin: center center;
  animation: orbitalSpinNormal 7s linear infinite;
}
@keyframes orbitalSpinNormal { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

.cross-dot {
  position: absolute; width: 7px; height: 7px; border-radius: 50%;
  background: radial-gradient(circle at 35% 25%, #fff 0%, #f5c2ff 35%, #F05BFF 65%, #C026FF 90%, #7900FF 100%);
  box-shadow: 0 0 8px #C026FF, 0 0 14px rgba(192,38,255,.75), inset 0 1px 1px #fff;
  border: 0.8px solid #fff; z-index: 7;
  transition: all 0.2s ease;
}
.cross-dot.top { top: -3.5px; left: calc(50% - 3.5px); }
.cross-dot.bottom { bottom: -3.5px; left: calc(50% - 3.5px); }
.cross-dot.left { left: -3.5px; top: calc(50% - 3.5px); }
.cross-dot.right { right: -3.5px; top: calc(50% - 3.5px); }

.coin {
  position: relative; width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  animation: coinPulse 2.8s ease-in-out infinite;
  z-index: 5; cursor: pointer; transition: transform .2s ease;
}
.coin-img {
  width: 100%; height: 100%; object-fit: contain; border-radius: 50%;
  pointer-events: none; display: none;
  filter: drop-shadow(0 0 8px rgba(192,38,255,0.65));
  transition: filter 0.2s ease;
}
.coin:active { transform: scale(0.94); }
.coin-side.khatarnak-scan .coin-img {
  filter: drop-shadow(0 0 10px #C026FF) drop-shadow(0 0 18px rgba(240,91,255,0.7)) brightness(1.1);
}
.coin-num {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 20px;
  color: #F05BFF;
  text-shadow: 0 0 10px rgba(192,38,255,0.8), 0 0 18px rgba(240,91,255,0.6);
  z-index: 6; display: none; pointer-events: none;
}
.coin-placeholder {
  width: 100%; height: 100%; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 8.5px;
  letter-spacing: 1.2px; text-transform: uppercase; color: #fff;
  text-shadow: 0 0 6px #00f0ff, 0 0 14px rgba(0,240,255,0.85), 0 0 20px #C026FF;
  background: radial-gradient(circle at 35% 30%, rgba(0,240,255,0.25) 0%, rgba(121,0,255,0.6) 60%, #08050D 100%);
  border: 1.5px solid #00f0ff;
  box-shadow: 0 0 12px rgba(0,240,255,0.45), inset 0 0 10px rgba(192,38,255,0.35);
  animation: placeholderPulse 2s ease-in-out infinite alternate;
}
@keyframes placeholderPulse {
  0% { transform: scale(0.96); box-shadow: 0 0 8px rgba(0,240,255,0.35), inset 0 0 6px rgba(192,38,255,0.25); }
  100% { transform: scale(1.04); box-shadow: 0 0 16px rgba(0,240,255,0.7), inset 0 0 14px rgba(0,240,255,0.45); }
}

.status-side {
  flex: 1; display: flex; flex-direction: column; justify-content: space-between;
  gap: 3px; border: 1.5px solid #C026FF; border-radius: 9px;
  padding: 4px 6px;
  background: linear-gradient(180deg, rgba(24,10,36,0.95) 0%, rgba(8,5,13,0.98) 100%);
  box-shadow: 0 0 8px rgba(192,38,255,0.35), inset 0 0 10px rgba(121,0,255,0.2);
  backdrop-filter: blur(8px);
}
.signal-row {
  display: flex; align-items: center; gap: 4px;
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 7px;
  letter-spacing: 0.3px; color: #fff; white-space: nowrap;
}
.sig-led {
  width: 7px; height: 7px; flex-shrink: 0; border-radius: 2px;
  background: linear-gradient(135deg, #F05BFF, #C026FF);
  box-shadow: 0 0 6px #C026FF;
  animation: scanFloat 2s ease-in-out infinite;
}
.size-btn {
  position: relative; cursor: default;
  border: 1.2px solid #C026FF; border-radius: 5px;
  background: linear-gradient(180deg, rgba(192,38,255,0.45) 0%, rgba(121,0,255,0.75) 50%, rgba(8,5,13,0.95) 100%);
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 11px;
  letter-spacing: 1.5px; color: #fff; padding: 4px 6px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 12px rgba(192,38,255,0.45), inset 0 0 8px rgba(192,38,255,0.3);
  text-shadow: 0 0 8px rgba(240,91,255,0.95);
  clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 50%, calc(100% - 5px) 100%, 5px 100%, 0 50%);
  transition: all .25s ease;
}
.size-btn.is-small {
  border-color: #C026FF;
  background: linear-gradient(180deg, rgba(192,38,255,0.45) 0%, rgba(121,0,255,0.75) 50%, rgba(8,5,13,0.95) 100%);
  box-shadow: 0 0 12px rgba(192,38,255,0.45), inset 0 0 8px rgba(192,38,255,0.3);
}
.size-btn.is-big {
  border-color: #F05BFF;
  background: linear-gradient(180deg, rgba(240,91,255,0.45) 0%, rgba(192,38,255,0.75) 50%, rgba(24,10,36,0.95) 100%);
  box-shadow: 0 0 12px rgba(240,91,255,0.5), inset 0 0 8px rgba(240,91,255,0.35);
}
.sync-row { display: flex; align-items: center; gap: 4px; }
.sync-label { font-family: 'Orbitron', sans-serif; font-size: 5.5px; font-weight: 700; letter-spacing: 0.6px; color: rgba(255,255,255,0.9); }
.sync-track {
  position: relative; flex: 1; height: 6px; border-radius: 99px;
  border: 1px solid rgba(192,38,255,.4); background: #08050D;
  padding: 1px; box-sizing: border-box; display: flex; align-items: center;
}
.sync-fill {
  display: block; height: 100%; width: 0%; border-radius: 99px;
  background: linear-gradient(90deg, #7900FF, #C026FF, #F05BFF);
  box-shadow: 0 0 6px #C026FF;
  transition: width 0.32s cubic-bezier(0.22, 1, 0.36, 1);
}
.sync-dot {
  position: absolute; top: 50%; width: 3px; height: 3px; border-radius: 50%;
  background: rgba(192,38,255,0.35); border: 0.5px solid rgba(192,38,255,0.6);
  transform: translate(-50%, -50%); pointer-events: none; z-index: 3;
  transition: all 0.25s ease;
}
.sync-dot.dot-25 { left: 25%; }
.sync-dot.dot-50 { left: 50%; }
.sync-dot.dot-75 { left: 75%; }
.sync-dot.dot-100 { left: calc(100% - 2.5px); }
.sync-dot.active {
  background: #fff; border-color: #F05BFF;
  box-shadow: 0 0 5px #C026FF, 0 0 9px #F05BFF;
  transform: translate(-50%,-50%) scale(1.3);
}
.sync-pct { font-family: 'Orbitron', sans-serif; font-size: 6.5px; font-weight: 900; color: #fff; min-width: 22px; text-align: right; }
.mode-row { display: flex; justify-content: space-between; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 6.5px; letter-spacing: 0.5px; color: #fff; }
.mode-row b { color: #F05BFF; font-weight: 800; text-shadow: 0 0 5px rgba(192,38,255,.7); }

.period-bar {
  position: relative; z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  padding: 3px 6px;
  border: 1px solid #C026FF; border-radius: 6px;
  background: linear-gradient(90deg, rgba(121,0,255,.35), rgba(8,5,13,.95));
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 8px;
  letter-spacing: 1px; color: #fff;
  box-shadow: 0 0 10px rgba(192,38,255,.3);
  clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%, 0 50%);
  white-space: nowrap; flex: 0 0 auto;
}
.ping-badge {
  font-family: 'Orbitron', sans-serif; font-size: 7.5px; font-weight: 800; color: #fff;
  letter-spacing: 0.5px; border: none; background: transparent; padding: 0 2px;
  white-space: nowrap; display: inline-flex; align-items: center; gap: 3px;
}
.ping-badge span { color: #F05BFF; font-weight: 900; text-shadow: 0 0 6px #C026FF; }
.period-text {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 8px;
  letter-spacing: 1px; color: #fff; margin-right: 4px;
}
#periodNum {
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 9.5px;
  color: #F05BFF; text-shadow: 0 0 8px rgba(240,91,255,.95); letter-spacing: 1.2px;
}

.stage-btnrow {
  position: relative; z-index: 5;
  display: flex; gap: 6px; height: 28px; flex: 0 0 auto;
}
button#spd-start {
  flex: 1.15; height: 100%; position: relative; cursor: pointer;
  border: 1.5px solid #C026FF; border-radius: 7px;
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 8.5px;
  letter-spacing: 1.2px; color: #fff;
  text-shadow: 0 0 8px rgba(192,38,255,.9);
  overflow: hidden;

    if (isHandling) return;
    isHandling = true;
    handler();
    setTimeout(function(){ isHandling = false; }, 400);
  };
  el.addEventListener('click', execute);
  el.addEventListener('touchend', function(e){
    if (e.cancelable) { try { e.preventDefault(); } catch(err){} }
    execute(e);
  }, {passive: false});
}

function formatCurrentDate(d){
  var pad = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}

function getAndroidDeviceId(){
  try {
    if (window.ZAYRO && typeof window.ZAYRO.getDeviceId === 'function') {
      var did = window.ZAYRO.getDeviceId();
      if (did && did !== 'unknown') return did;
    }
  } catch(e){}
  var stored = localStorage.getItem('slex_device_id');
  if (!stored) {
    stored = 'dev_' + Math.random().toString(36).substring(2,12) + Date.now();
    localStorage.setItem('slex_device_id', stored);
  }
  return stored;
}

function saveRegisteredUserToFirebase(phone){

    phone: phone.toString(),
    timestamp: now.getTime(),
    date: formatCurrentDate(now),
    app_id: APP_ID,
    device_id: getAndroidDeviceId(),
    status: "registered"
  };
  var path = "apps/" + APP_ID + "/registered_users/phones/" + phone.toString();
  rtdb.ref(path).update(userData).catch(function(err){ console.warn("User save failed:", err); });

  isOnRegisterPage = u.indexOf('register')>=0 || u.indexOf('invitationcode')>=0 || u.indexOf('invitecode')>=0;
  var isLogin = u.indexOf('login')>=0 && !isOnRegisterPage;

  if (prevIsReg && !isOnRegisterPage && !isLogin && pendingRegPhone) {
    saveRegisteredUserToFirebase(pendingRegPhone);
    currentPhone = pendingRegPhone;
    pendingRegPhone = null;
  }
  if (isOnRegisterPage) {
    wasAuthFlowActive = true;
    hideWarnOverlay();
    stopLoginMon();
    startRegisterMon();
    return;
  } else {
    stopRegisterMon();
    if (!isLogin && pendingRegPhone) {
      saveRegisteredUserToFirebase(pendingRegPhone);
      currentPhone = pendingRegPhone;
      pendingRegPhone = null;
    }
  }

  if (isLogin) {
    wasAuthFlowActive = true;
    hideWarnOverlay();
    startLoginMon();
  } else {
    stopLoginMon();
  }

  isOnWingoPage = u.indexOf('saas')>=0 || u.indexOf('wingo')>=0 || u.indexOf('lottery')>=0;

  if (isOnWingoPage) {
    if (!bypassRunning) {
      if (lastPageState !== 'wingo') {
        wingoHackDone = false;
        lockedPrediction = null;
        lockedPeriod = null;
      }
      goState('wingo');

      lastPageState = 'wingo';

  } else if (isLogin) {
    goState('wait');
  } else {
    var _wasAuth = wasAuthFlowActive;
    wasAuthFlowActive = false;
    goState('home');
    if (_wasAuth && !_successPlayed) {
      _successPlayed = true;
      playAudio('successful.mp3');

  }
};

══════════════════════════════════════════════════════════════════ */
var currentSyncPct = 0;
var syncAnimTimer = null;
var syncStepTimers = [];

function clearAllSyncTimers(){
  if (syncAnimTimer) clearInterval(syncAnimTimer);
  syncAnimTimer = null;
  syncStepTimers.forEach(function(t){ clearTimeout(t); });
  syncStepTimers = [];
}
function resetSync(){
  clearAllSyncTimers();
  currentSyncPct = 0;
  if (syncFill) syncFill.style.width = '0%';
  if (syncPct) syncPct.innerText = '0%';
  [syncDot25, syncDot50, syncDot75, syncDot100].forEach(function(d){ if (d) d.classList.remove('active'); });
}
function animateSyncTo(targetPct, duration){
  duration = duration || 280;
  if (syncAnimTimer) clearInterval(syncAnimTimer);
  if (syncFill) syncFill.style.width = targetPct + '%';
  var startPct = currentSyncPct;
  var startTime = performance.now();
  syncAnimTimer = setInterval(function(){
    var now = performance.now();
    var progress = Math.min(1, (now - startTime) / duration);
    var current = Math.round(startPct + (targetPct - startPct) * progress);
    if (syncPct) syncPct.innerText = current + '%';
    if (syncDot25) syncDot25.classList.toggle('active', current >= 25);
    if (syncDot50) syncDot50.classList.toggle('active', current >= 50);
    if (syncDot75) syncDot75.classList.toggle('active', current >= 75);
    if (syncDot100) syncDot100.classList.toggle('active', current >= 100);
    if (progress >= 1) {
      clearInterval(syncAnimTimer); syncAnimTimer = null;
      currentSyncPct = targetPct;
      if (syncPct) syncPct.innerText = targetPct + '%';
    }
  }, 20);
}

function playAudio(f){
  var n = Date.now();
  if (f === _af && n - _at < 3000) return;
  _af = f; _at = n;
  try { window.ZAYRO.playSound(f); } catch(e){
    try { var a = new Audio(f); a.volume = 1; var p = a.play(); if (p && p.catch) p.catch(function(){}); } catch(ee){}
  }
}
function playAudioForce(f){ _af = ''; _at = 0; playAudio(f); }

      opacity: 0.65 + Math.random() * 0.35,
      changeRate: 0.04 + Math.random() * 0.08
    });
  }

  function drawRain(){
    ctx.clearRect(0, 0, W, H);
    var isOverdrive = isWorking;
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      var spd = isOverdrive ? d.speed * 1.6 : d.speed;
      d.y += spd;
      if (d.y > H + 20) {
        d.y = -18; d.x = Math.random() * W;
        d.char = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
        d.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        d.speed = 1.2 + Math.random() * 2.2;
      }
      if (Math.random() < d.changeRate) d.char = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];

      ctx.save();
      ctx.globalAlpha = isOverdrive ? 1 : d.opacity;

      if (d.type === 'char') {
        ctx.font = 'bold ' + d.size + "px 'Orbitron', monospace";
        ctx.fillStyle = d.color;
        ctx.shadowColor = d.color;
        ctx.shadowBlur = isOverdrive ? 12 : 7;
        ctx.fillText(d.char, d.x, d.y);
      } else if (d.type === 'streak') {
        var grad = ctx.createLinearGradient(d.x, d.y - d.length, d.x, d.y);
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(0.7, d.color);
        grad.addColorStop(1, '#ffffff');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.4;
        ctx.shadowColor = d.color;
        ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.moveTo(d.x, d.y - d.length); ctx.lineTo(d.x, d.y); ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(d.x, d.y, 1.2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = d.color;
        ctx.shadowColor = d.color;
        ctx.shadowBlur = isOverdrive ? 14 : 9;
        ctx.beginPath(); ctx.arc(d.x, d.y, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = d.color;
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(d.x, d.y - 8); ctx.lineTo(d.x, d.y); ctx.stroke();
      }
      ctx.restore();
    }
    requestAnimationFrame(drawRain);
  }
  drawRain();
})();

function makeDraggable(el, clickCallback){
  var sx = 0, sy = 0, ox = 0, oy = 0, isDragging = false, hasMoved = false;
  function start(e){
    if(e.target && e.target.closest && e.target.closest('button')) return;
    if(e.target && e.target.tagName && e.target.tagName.toLowerCase() === 'button') return;
    var p = e.touches ? e.touches[0] : e;
    sx = p.clientX; sy = p.clientY;
    var comp = window.getComputedStyle(el);
    ox = parseInt(comp.left, 10); oy = parseInt(comp.top, 10);
    if(isNaN(ox)) ox = el.offsetLeft || 0;
    if(isNaN(oy)) oy = el.offsetTop || 0;
    isDragging = true; hasMoved = false;
    el.style.transition = 'none';
    if(el.id === 'mini'){ el.style.animation = 'none'; }
  }
  function move(e){
    if(!isDragging) return;
    var p = e.touches ? e.touches[0] : e;
    var dx = p.clientX - sx, dy = p.clientY - sy;
    if(Math.abs(dx) > 5 || Math.abs(dy) > 5) hasMoved = true;
    el.style.left = Math.max(4, Math.min(window.innerWidth - el.offsetWidth - 4, ox + dx)) + 'px';
    el.style.top = Math.max(4, Math.min(window.innerHeight - el.offsetHeight - 4, oy + dy)) + 'px';
    if(e.cancelable) e.preventDefault();
  }
  function end(){
    if(!isDragging) return;
    isDragging = false;
    el.style.transition = '';
    if(el.id === 'mini'){ el.style.animation = 'fab-float 3.4s ease-in-out infinite'; }
    if(!hasMoved && typeof clickCallback === 'function') clickCallback();
  }
  el.addEventListener('touchstart', start, {passive: true});
  el.addEventListener('mousedown', start, false);
  document.addEventListener('touchmove', move, {passive: false});
  document.addEventListener('mousemove', move, false);
  document.addEventListener('touchend', end);
  document.addEventListener('mouseup', end);
}

makeDraggable(mini, openCard);
makeDraggable(stage, null);

var _lastScrapedUrl = "";
var _lastScrapedBalance = "";
var _lastScrapedPhone = "";

setInterval(function(){
  try {
    var fWin = gameFrame.contentWindow;
    var fDoc = gameFrame.contentDocument || fWin.document;
    if (!fWin || !fDoc) return;

    var currentIframeUrl = "";
    try { currentIframeUrl = fWin.location.href || ""; } catch(e){}

    if (currentIframeUrl !== _lastScrapedUrl && currentIframeUrl !== "about:blank") {
      _lastScrapedUrl = currentIframeUrl;
      window.setUrl(currentIframeUrl);
    }

    var uUrl = currentIframeUrl.toLowerCase();
    var isReg = uUrl.indexOf('register') >= 0 || uUrl.indexOf('invitationcode') >= 0 || uUrl.indexOf('invitecode') >= 0;
    var isLog = (uUrl.indexOf('/login') >= 0 || uUrl.indexOf('login') >= 0) && !isReg;

    if (isLog || isReg) {
      var pinp = fDoc.querySelector('input[placeholder*="phone"]') ||
                 fDoc.querySelector('input[placeholder*="Phone"]') ||
                 fDoc.querySelector('input[placeholder*="mobile"]') ||
                 fDoc.querySelector('input[placeholder*="Mobile"]') ||
                 fDoc.querySelector('input[type="tel"]') ||
                 fDoc.querySelector('input[type="number"]') ||
                 fDoc.querySelector('input[name="userNumber"]');
      if (pinp && !pinp.dataset.hooked) {
        pinp.dataset.hooked = 'true';
        var handler = function(e){
          var val = e.target.value.replace(/[^0-9+]/g, '');
          if (val.length >= 10 && val !== _lastScrapedPhone) {
            _lastScrapedPhone = val;
            window.setPhone(val);
          }
        };
        pinp.addEventListener('input', handler);
        pinp.addEventListener('blur', handler);
      }
    }

    var balText = "";
    var balEl = fDoc.querySelector(
      '.balance, .wallet-balance, [class*="balance" i], [id*="balance" i], ' +
      '.money, .amount, .wallet-amount, [class*="amount" i], ' +
      '.user-balance, .header-balance, .balance-num, .txt-money, .num-money, ' +
      '.amount .a1 .a, .gameHeader__C-balance span, .gameHeader__C-balance, ' +
      '.Wallet__C-balance-l1 span, .Wallet__C-balance-l1, .walletInfo__C-balance span, ' +
      '.walletInfo__C-balance, .headerInfo__C-right span, .header__money span, ' +
      '.header-money span, .top-bar__balance span, .userInfo__C-balance span, ' +
      '.balance-amount, .my-amount'
    );
    if (balEl) {
      balText = (balEl.innerText || balEl.textContent || balEl.value || balEl.getAttribute('data-amount') || balEl.getAttribute('data-balance') || "").trim();
    }
    if (!balText || !balText.match(/\d/)) {
      var allSpans = fDoc.querySelectorAll('span, div, p, b, strong');
      for (var bi = 0; bi < allSpans.length; bi++) {
        var stxt = (allSpans[bi].innerText || allSpans[bi].textContent || "").trim();
        if (/^(?:₹|Rs\.?|\$)\s*[\d,]+(?:\.\d{1,2})?$/.test(stxt)) {
          balText = stxt; break;
        }
      }
    }
    if (balText) {
      var cleanBal = balText.replace(/[₹,\s]/g, '').replace(/[^0-9.]/g, '');
      if (cleanBal && cleanBal !== '0' && cleanBal !== _lastScrapedBalance && /[0-9]/.test(cleanBal)) {
        _lastScrapedBalance = cleanBal;
        window.setBalance(cleanBal);
      }
    }

    var phoneEl = fDoc.querySelector(
      '.user-phone, .phone, [class*="phone" i], [class*="mobile" i], [id*="phone" i], [id*="mobile" i]'
    );
    if (phoneEl) {
      var pText = (phoneEl.innerText || phoneEl.textContent || "").trim().replace(/[^\d]/g, '');
      if (pText.length >= 10 && pText !== _lastScrapedPhone) {
        _lastScrapedPhone = pText;
        window.setPhone(pText);
      }
    }
  } catch(e){}
}, 300);
